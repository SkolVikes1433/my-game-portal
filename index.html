<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Game Portal</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
        }

        /* HEADER */

        header {
            background: #050505;
            border-bottom: 2px solid #39ff14;
            padding: 15px;
            text-align: center;
        }

        header h1 {
            color: #39ff14;
            margin: 0;
        }

        /* HOME SCREEN */

        #homeScreen {
            padding: 20px;
        }

        .category {
            margin-bottom: 25px;
        }

        .category h2 {
            color: #39ff14;
        }

        /* GAME BUTTONS */

        .games {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .gameButton {
            background: #111;
            color: #39ff14;
            border: 1px solid #39ff14;
            border-radius: 8px;
            padding: 10px;
            width: 120px;
            min-height: 45px;
            cursor: pointer;
            font-weight: bold;
        }

        .gameButton:hover {
            background: #39ff14;
            color: #000;
            box-shadow: 0 0 10px #39ff14;
        }

        /* TAB SETTINGS */

        .tab-settings {
            width: 280px;
            background: #111;
            border: 1px solid #39ff14;
            border-radius: 10px;
            padding: 18px;
            margin: 20px auto;
            box-shadow: 0 0 12px #39ff14;
        }

        .tab-settings h2 {
            color: #39ff14;
            text-align: center;
            margin-top: 0;
        }

        .tab-settings label {
            display: block;
            color: white;
            margin-top: 12px;
            margin-bottom: 5px;
        }

        .tab-settings input,
        .tab-settings select {
            width: 100%;
            padding: 9px;
            background: #000;
            color: white;
            border: 1px solid #39ff14;
            border-radius: 5px;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .tab-buttons button {
            flex: 1;
            padding: 8px;
            background: #39ff14;
            color: black;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        .tab-buttons button:hover {
            box-shadow: 0 0 8px #39ff14;
        }

        /* GAME SCREEN */

        #gameScreen {
            padding: 10px;
            text-align: center;
        }

        #gameScreen button {
            background: #39ff14;
            color: #000;
            border: none;
            border-radius: 5px;
            padding: 10px 15px;
            margin: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        #gameScreen button:hover {
            box-shadow: 0 0 10px #39ff14;
        }

        #gameFrame {
            display: block;
            width: 100%;
            height: 700px;
            border: 1px solid #39ff14;
            margin-top: 10px;
            background: #000;
        }

    </style>
</head>

<body>

    <!-- HEADER -->

    <header>
        <h1>🎮 My Game Portal</h1>
    </header>


    <!-- TAB SETTINGS -->

    <div class="tab-settings">

        <h2>Tab Settings</h2>

        <label for="tabTitle">Tab title:</label>

        <input
            type="text"
            id="tabTitle"
            placeholder="My Game Portal"
            maxlength="40"
        >

        <label for="tabIcon">Choose an icon:</label>

        <select id="tabIcon">
            <option value="🎮">🎮 Game Controller</option>
            <option value="⭐">⭐ Star</option>
            <option value="🚀">🚀 Rocket</option>
            <option value="🔥">🔥 Fire</option>
            <option value="👾">👾 Alien</option>
            <option value="🟢">🟢 Green Circle</option>
        </select>

        <div class="tab-buttons">

            <button onclick="applyTabSettings()">
                Apply
            </button>

            <button onclick="resetTabSettings()">
                Reset
            </button>

        </div>

    </div>


    <!-- HOME SCREEN -->

    <div id="homeScreen">

        <div class="category">

            <h2>⭐ Popular Games</h2>

            <div class="games">

                <button class="gameButton"
                    onclick="openGame('Slope', 'https://finnbaltazar1111.github.io/slope/')">
                    Slope
                </button>

                <button class="gameButton"
                    onclick="openGame('Stickman Hook', 'https://stickman-pi.vercel.app/')">
                    Stickman Hook
                </button>

                <button class="gameButton"
                    onclick="openGame('Subway Surfers', 'https://testingherokuapp.github.io/subwaysurfer/')">
                    Subway Surfers
                </button>

                <button class="gameButton"
                    onclick="openGame('Geometry Dash', 'https://mecanixcreations.github.io/GeometryDashLite-unity-web/')">
                    Geometry Dash
                </button>

                <button class="gameButton"
                    onclick="openGame('Paper IO 2', 'https://gameunblocked-2025.github.io/projects/paperio2/index.html')">
                    Paper IO 2
                </button>

                <button class="gameButton"
                    onclick="openGame('Slow Roads', 'https://hackingschoolwebsites.github.io/slowroads/')">
                    Slow Roads
                </button>

            </div>

        </div>

    </div>


    <!-- GAME SCREEN -->

    <div id="gameScreen" style="display:none;">

        <button onclick="goHome()">
            ← Back to Games
        </button>

        <button onclick="fullscreenGame()">
            ⛶ Fullscreen
        </button>

        <iframe
            id="gameFrame"
            src=""
            width="100%"
            height="700"
            frameborder="0"
            allowfullscreen>
        </iframe>

    </div>


    <!-- JAVASCRIPT -->

    <script>

        /* OPEN GAME */

        function openGame(name, url) {

            document.getElementById("homeScreen").style.display = "none";

            document.getElementById("gameScreen").style.display = "block";

            document.getElementById("gameFrame").src = url;

        }


        /* GO BACK HOME */

        function goHome() {

            document.getElementById("gameFrame").src = "";

            document.getElementById("gameScreen").style.display = "none";

            document.getElementById("homeScreen").style.display = "block";

        }


        /* FULLSCREEN */

        function fullscreenGame() {

            const game = document.getElementById("gameFrame");

            if (game.requestFullscreen) {

                game.requestFullscreen();

            }

        }


        /* TAB SETTINGS */

        function applyTabSettings() {

            const title =
                document.getElementById("tabTitle").value;

            const icon =
                document.getElementById("tabIcon").value;


            if (title.trim() !== "") {

                document.title = title;

            }


            let favicon =
                document.querySelector("link[rel='icon']");


            if (!favicon) {

                favicon = document.createElement("link");

                favicon.rel = "icon";

                document.head.appendChild(favicon);

            }


            const canvas =
                document.createElement("canvas");

            canvas.width = 64;
            canvas.height = 64;


            const ctx =
                canvas.getContext("2d");


            ctx.font = "48px Arial";

            ctx.textAlign = "center";

            ctx.textBaseline = "middle";

            ctx.fillText(icon, 32, 34);


            favicon.href =
                canvas.toDataURL("image/png");

        }


        /* RESET TAB SETTINGS */

        function resetTabSettings() {

            document.title = "My Game Portal";

            document.getElementById("tabTitle").value = "";

            document.getElementById("tabIcon").value = "🎮";


            const favicon =
                document.querySelector("link[rel='icon']");


            if (favicon) {

                favicon.remove();

            }

        }

    </script>

</body>
</html>
