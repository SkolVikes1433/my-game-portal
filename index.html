
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOID NETWORK V6</title>
<link id="favicon" rel="icon" type="image/png" href="./void-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#05070d;color:#eaf4ff;font-family:Rajdhani,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:15px;padding:18px 24px;background:#03060d;border-bottom:1px solid #19385e}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:44px;height:44px;object-fit:contain}
h1{margin:0;color:#48a9ff;font:25px 'Black Ops One',cursive}
nav{display:flex;flex-wrap:wrap;gap:10px}
nav a,.button{padding:10px 15px;color:#eaf4ff;background:#101b2c;border:1px solid #2b5682;border-radius:8px;text-decoration:none;font:700 16px Rajdhani,sans-serif;cursor:pointer}
nav a:hover,.button:hover{background:#17406a;border-color:#48a9ff}
main{width:min(1150px,94%);margin:28px auto}
.panel{padding:22px;margin-bottom:22px;background:#0a111e;border:1px solid #1b3555;border-radius:12px}
h2{margin:0 0 8px;color:#55b2ff;font-size:25px}
p{color:#9cb2ce}
#gameSearch{width:100%;padding:13px 15px;margin-top:12px;color:white;background:#050b15;border:1px solid #294362;border-radius:8px;font:18px Rajdhani,sans-serif}
#gameSearch:focus{outline:1px solid #48a9ff}
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px}
.game-card{min-height:58px;padding:15px;text-align:left;color:#eaf4ff;background:#0c1727;border:1px solid #203c5d;border-radius:8px;font:700 18px Rajdhani,sans-serif;cursor:pointer;overflow-wrap:anywhere}
.game-card:hover{background:#11243b;border-color:#48a9ff;transform:translateY(-2px)}
#noResults{display:none}
#playerPanel{display:none;margin-top:24px}
.player-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:14px}
#gameFrame{width:100%;height:70vh;min-height:380px;border:1px solid #294362;border-radius:8px;background:#fff}
footer{text-align:center;padding:25px;color:#7189a8}
@media(max-width:550px){header{padding:15px}.brand img{width:35px;height:35px}h1{font-size:20px}main{width:92%;margin:18px auto}.panel{padding:16px}.games-grid{grid-template-columns:repeat(2,minmax(0,1fr))}#gameFrame{min-height:320px}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="./void-logo.png" alt="Void Network logo">
    <h1>VOID NETWORK V6</h1>
  </div>
  <nav>
    <a href="./index.html">🎮 Games</a>
    <a href="./settings.html">⚙ Tab Settings</a>
  </nav>
</header>

<main>
  <section class="panel">
    <h2>GAME PORTAL</h2>
    <p>Choose a game to open it in the player below.</p>
    <input id="gameSearch" type="search" placeholder="Search all games..." aria-label="Search games">
  </section>

  <section class="games-grid" id="gamesGrid" aria-label="Games"></section>
  <p id="noResults">No games match your search.</p>

  <section class="panel" id="playerPanel">
    <div class="player-top">
      <h2 id="currentGameTitle">Game</h2>
      <div>
        <a id="openGame" class="button" href="#" target="_blank" rel="noopener noreferrer">Open Game ↗</a>
        <button id="closeGame" class="button" type="button">Close Game</button>
      </div>
    </div>
    <iframe id="gameFrame" title="Game player" src="about:blank" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>
  </section>
</main>

<footer>VOID NETWORK V6 · GAME PORTAL</footer>

<script>

["Gaming Escape","https://badpiggies.global.ssl.fastly.net/index.html"],

["There Is No Game","https://unlocktheworld.github.io/There-is-no-game/index.html"],
["The Annoying Button","https://unlocktheworld.github.io/bigredbutton/index.html"],
["Super Mario Bros Deluxe","https://gamebackup.github.io/emu_games/games/super_mario_bros_deluxe/"],
["FNF","https://gamebackup.github.io/standalone_games/fnf/"],
["Portal 2D","https://gamebackup.github.io/flash_games/games/portal2d/"],
["Deal Or No Deal","https://unlocktheworld.github.io/deal-or-no-deal/index.html"],
["Tanuki Sunset","https://gamebackup.github.io/standalone_games/tanukisunset/"],
["Doge Miner 1","https://unlocktheworld.github.io/DogeMiner/index.html"],
["Doge Miner 2","https://unlocktheworld.github.io/Dogeminer2/index.html"],
["Retro Bowl","https://gamebackup.github.io/standalone_games/retro%20bowl/"],
["Drive Mad","https://unlocktheworld.github.io/drive-mad/index.html"],
["Mario Kart","https://gamebackup.github.io/standalone_games/supermariokart/"],
["Unfair Mario","https://unlocktheworld.github.io/unfair-mario/index.html"],
["Mario Party","https://gamebackup.github.io/emu_games/games/mario_party/"],
["MK49","https://mk49.cyou/"],
["Mario Kart 64","https://gamebackup.github.io/emu_games/games/mariokart64/"],
["Smash Karts","https://unlocktheworld.github.io/smash-karts/index.html"],
["Super Mario Bros","https://gamebackup.github.io/emu_games/games/mario3/"],
["Doodle Jump","https://unlocktheworld.github.io/doodle-jump/index.html"],

["Escape Road","https://escaperoadx.github.io/"],

["Run 3","https://www.coolmathgames.com/0-run-3"],
["Fireboy & Watergirl","https://www.coolmathgames.com/0-fireboy-and-watergirl-in-the-forest-temple"],

["Papa's Pizzeria","https://www.coolmathgames.com/0-papas-pizzeria"],
["2048","https://www.coolmathgames.com/0-2048"]
];

const grid = document.getElementById("gamesGrid");
const search = document.getElementById("gameSearch");
const player = document.getElementById("playerPanel");
const frame = document.getElementById("gameFrame");
const gameTitle = document.getElementById("currentGameTitle");
const openLink = document.getElementById("openGame");

function renderGames(query=""){
  grid.replaceChildren();
  const filtered = games.filter(([name,url]) =>
    name.toLowerCase().includes(query.toLowerCase().trim())
  );
  filtered.forEach(([name,url])=>{
    const button=document.createElement("button");
    button.type="button";
    button.className="game-card";
    button.textContent=name;
    button.addEventListener("click",()=>launchGame(name,url));
    grid.appendChild(button);
  });
  document.getElementById("noResults").style.display=filtered.length?"none":"block";
}

function launchGame(name,url){
  gameTitle.textContent=name;
  frame.src=url;
  openLink.href=url;
  player.style.display="block";
  player.scrollIntoView({behavior:"smooth",block:"start"});
}

search.addEventListener("input",()=>renderGames(search.value));

document.getElementById("closeGame").addEventListener("click",()=>{
  frame.src="about:blank";
  player.style.display="none";
});

function applyTabSettings(){
  try{
    const selected=localStorage.getItem("userCloak")||"Default";
    const titles={
      "Default":"VOID NETWORK V6",
      "Khan":"Khan Academy",
      "Google":"Google",
      "YouTube":"YouTube",
      "Canvas":"Canvas",
      "Docs":"Google Docs",
      "Desmos":"Desmos",
      "Drive":"Google Drive",
      "Google Classroom":"Google Classroom",
      "XtraMath":"XtraMath"
    };
    const icons={
      "Default":"./void-logo.png",
      "Khan":"https://cdn.kastatic.org/images/favicon.ico",
      "Google":"https://www.google.com/favicon.ico",
      "YouTube":"https://www.youtube.com/s/desktop/2f549df7/img/favicon_32x32.png",
      "Canvas":"https://du11hjcvx0uqb.cloudfront.net/br/dist/images/favicon-e10d657a73.ico",
      "Docs":"https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico",
      "Desmos":"https://www.desmos.com/favicon.ico",
      "Drive":"https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png",
      "Google Classroom":"https://classroom.google.com/favicon.ico",
      "XtraMath":"https://xtramath.org/favicon.ico"
    };
    document.title=titles[selected]||titles.Default;
    document.getElementById("favicon").href=icons[selected]||icons.Default;
  }catch(error){
    document.title="VOID NETWORK V6";
  }
}

renderGames();
applyTabSettings();
window.addEventListener("pageshow",applyTabSettings);
window.addEventListener("storage",applyTabSettings);
</script>
</body>
</html>
