<!DOCTYPE html>
<html>
<head>
    <title>My Game Site</title>

    <style>
        body {
            margin: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            background: #111;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #39ff14;
        }

        h1 {
            color: #39ff14;
            margin: 0;
        }

        .search {
            margin-top: 15px;
            padding: 10px;
            width: 250px;
            border-radius: 8px;
            border: none;
        }

        .section {
            padding: 20px;
        }

        .section h2 {
            color: #39ff14;
        }

        .games {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .game {
            background: #111;
            border: 1px solid #39ff14;
            border-radius: 10px;
            padding: 20px;
            width: 180px;
            text-align: center;
        }

        .game button {
            background: #39ff14;
            color: black;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .game button:hover {
            background: white;
        }
    </style>
</head>

<body>

    <header>
        <h1>🎮 MY GAME SITE</h1>

        <input
            class="search"
            type="text"
            placeholder="Search games..."
        >
    </header>

    <div class="section">
        <h2>🔥 Most Recent Games</h2>

        <div class="games">

  <div class="game">
        <h3>Game 1</h3>
        <button onclick="alert('Game 1 coming soon!')">PLAY</button>
    </div>

    <div class="game">
        <h3>Game 2</h3>
        <button onclick="alert('Game 2 coming soon!')">PLAY</button>
    </div>

    <div class="game">
        <h3>Game 3</h3>
        <button onclick="alert('Game 3 coming soon!')">PLAY</button>
    </div>

        </div>
    </div>

    <div class="section">
        <h2>⚡ Action & Adventure</h2>

        <div class="games">

     <div class="game">
        <h3>Game 4</h3>
        <button onclick="alert('Game 4 coming soon!')">PLAY</button>
    </div>

    <div class="game">
        <h3>Game 5</h3>
        <button onclick="alert('Game 5 coming soon!')">PLAY</button>
    </div>

    <div class="game">
        <h3>Game 6</h3>
        <button onclick="alert('Game 6 coming soon!')">PLAY</button>
    </div>

</div>

        </div>
    </div>

</body>
</html>
