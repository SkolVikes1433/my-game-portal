<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game Portal</title>

    <!-- Edgy font -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #05070a;
            color: white;
            font-family: 'Rajdhani', sans-serif;
        }

        /* TOP BAR */
        header {
            height: 70px;
            background: #080b10;
            border-bottom: 2px solid #168cff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            color: #168cff;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .settingsButton {
            background: transparent;
            color: #168cff;
            border: 1px solid #168cff;
            padding: 9px 16px;
            border-radius: 6px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .settingsButton:hover {
            background: #168cff;
            color: black;
        }

        /* HOME */
        #homeScreen {
            padding: 30px;
        }

        .title {
            color: #168cff;
            font-size: 32px;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }

        /* GAME GRID */
        .games {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }

        /* GAME CARD */
        .game {
            width: 150px;
            background: #0b0f15;
            border: 1px solid #168cff;
            border-radius: 8px;
            padding: 8px;
            transition: 0.2s;
            box-shadow: 0 0 8px rgba(22, 140, 255, 0.15);
        }

        .game:hover {
            transform: translateY(-4px);
            box-shadow: 0 0 18px rgba(22, 140, 255, 0.5);
        }

        .game img {
            width: 100%;
            height: 105px;
            object-fit: cover;
            border-radius: 5px;
            display: block;
            background: #111820;
        }

        .game h3 {
            color: white;
            font-size: 16px;
            text-align: center;
            margin: 9px 0;
            letter-spacing: 1px;
        }

        .gameButton {
            width: 100%;
            background: #168cff;
            color: black;
            border: none;
            padding: 7px;
            border-radius: 5px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .gameButton:hover {
            background: #54b0ff;
        }

        /* GAME SCREEN */
        #gameScreen {
            display: none;
            padding: 15px;
        }

        .gameTopBar {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .gameControl {
            background: #168cff;
            color: black;
            border: none;
            padding: 9px 15px;
            border-radius: 5px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .gameControl:hover {
            background: #54b0ff;
        }

        #gameFrame {
            width: 100%;
            height: calc(100vh - 120px);
            border: 2px solid #168cff;
            border-radius: 7px;
            background: black;
        }

        /* MOBILE */
        @media (max-width: 600px) {

            #homeScreen {
                padding: 18px;
            }

            .games {
                gap: 10px;
            }

            .game {
                width: 135px;
            }

            .game img {
                height: 95px;
            }
        }
    </style>
</head>

<body>

    <!-- TOP BAR -->
    <header>

        <div class="logo">
            GAME PORTAL
        </div>

        <button class="settingsButton" onclick="openSettings()">
            ⚙ SETTINGS
        </button>

    </header>


    <!-- HOME PAGE -->
    <div id="homeScreen">

        <div class="title">
            GAMES
        </div>

        <!-- NO CATEGORIES OR SORTING -->
        <div class="games">


            <!-- SLOPE -->
            <div class="game">

                <img src="images/slope.png" alt="Slope">

                <h3>Slope</h3>

                <button class="gameButton"
                    onclick="openGame('Slope', 'https://finnbaltazar1111.github.io/slope/')">
                    PLAY
                </button>

            </div>


            <!-- STICKMAN HOOK -->
            <div class="game">

                <img src="images/stickman-hook.png" alt="Stickman Hook">

                <h3>Stickman Hook</h3>

                <button class="gameButton"
                    onclick="openGame('Stickman Hook', 'https://stickman-pi.vercel.app/')">
                    PLAY
                </button>

            </div>


            <!-- SUBWAY SURFERS -->
            <div class="game">

                <img src="images/subway-surfers.png" alt="Subway Surfers">

                <h3>Subway Surfers</h3>

                <button class="gameButton"
                    onclick="openGame('Subway Surfers', 'https://testingherokuapp.github.io/subwaysurfer/')">
                    PLAY
                </button>

            </div>


            <!-- GEOMETRY DASH -->
            <div class="game">

                <img src="images/geometry-dash.png" alt="Geometry Dash">

                <h3>Geometry Dash</h3>

                <button class="gameButton"
                    onclick="openGame('Geometry Dash', 'https://mecanixcreations.github.io/GeometryDashLite-unity-web/')">
                    PLAY
                </button>

            </div>


            <!-- PAPER IO 2 -->
            <div class="game">

                <img src="images/paper-io-2.png" alt="Paper IO 2">

                <h3>Paper IO 2</h3>

                <button class="gameButton"
                    onclick="openGame('Paper IO 2', 'https://gameunblocked-2025.github.io/projects/paperio2/index.html')">
                    PLAY
                </button>

            </div>


            <!-- SLOW ROADS -->
            <div class="game">

                <img src="images/slow-roads.png" alt="Slow Roads">

                <h3>Slow Roads</h3>

                <button class="gameButton"
                    onclick="openGame('Slow Roads', 'https://hackingschoolwebsites.github.io/slowroads/')">
                    PLAY
                </button>

            </div>


            <!-- KHAN ACADEMY -->
            <div class="game">

                <img src="images/khan-academy.png" alt="Khan Academy">

                <h3>Khan Academy</h3>

                <button class="gameButton"
                    onclick="openGame('Khan Academy', 'https://www.khanacademy.org/')">
                    OPEN
                </button>

            </div>


        </div>
    </div>


    <!-- GAME PAGE -->
    <div id="gameScreen">

        <div class="gameTopBar">

            <button class="gameControl" onclick="goHome()">
                ← BACK
            </button>

            <button class="gameControl" onclick="fullscreenGame()">
                ⛶ FULLSCREEN
            </button>

        </div>


        <iframe
            id="gameFrame"
            src=""
            frameborder="0"
            allowfullscreen>
        </iframe>

    </div>


    <script>

        /* OPEN A GAME */
        function openGame(name, url) {

            document.getElementById("homeScreen").style.display = "none";

            document.getElementById("gameScreen").style.display = "block";

            document.getElementById("gameFrame").src = url;

            document.title = name + " - Game Portal";
        }


        /* BACK TO GAMES */
        function goHome() {

            document.getElementById("gameFrame").src = "";

            document.getElementById("gameScreen").style.display = "none";

            document.getElementById("homeScreen").style.display = "block";

            document.title = "Game Portal";
        }


        /* FULLSCREEN */
        function fullscreenGame() {

            const game = document.getElementById("gameFrame");

            if (game.requestFullscreen) {
                game.requestFullscreen();
            }
        }


        /* OPEN SETTINGS PAGE */
        function openSettings() {

            window.location.href = "settings.html";

        }

    </script>

</body>
</html>
