<script>
    // Apply the icon and title selected on the Tab Settings page.
    function applyTabSettings() {
        const savedTitle = localStorage.getItem("customTabTitle");
        const savedIcon = localStorage.getItem("selectedTabIcon");

        if (savedTitle && savedTitle.trim() !== "") {
            document.title = savedTitle;
        } else {
            document.title = "Void Network V6";
        }

        if (savedIcon) {
            document.getElementById("favicon").href = savedIcon;
        }
    }

    // Open a game in the player screen on this same page.
    function openGame(name, url) {
        document.getElementById("homeScreen").style.display = "none";
        document.getElementById("gameScreen").style.display = "block";
        document.getElementById("gameTitle").textContent = name;
        document.getElementById("gameFrame").src = url;

        window.scrollTo(0, 0);
    }

    // Return to the game library.
    function backToGames() {
        document.getElementById("gameFrame").src = "about:blank";
        document.getElementById("gameScreen").style.display = "none";
        document.getElementById("homeScreen").style.display = "block";

        window.scrollTo(0, 0);
    }

    // Make the game player fullscreen.
    function fullscreenGame() {
        const frame = document.getElementById("gameFrame");

        if (frame.requestFullscreen) {
            frame.requestFullscreen();
        } else if (frame.webkitRequestFullscreen) {
            frame.webkitRequestFullscreen();
        }
    }

    // Filter games by the name typed into the search box.
    function filterGames() {
        const searchText = document.getElementById("search")
            .value.toLowerCase().trim();

        const cards = document.querySelectorAll(".game-card");
        let visibleCount = 0;

        cards.forEach(function(card) {
            const name = card.dataset.name.toLowerCase();
            const matches = name.includes(searchText);

            card.style.display = matches ? "" : "none";

            if (matches) {
                visibleCount++;
            }
        });

        document.getElementById("noResults").style.display =
            visibleCount === 0 ? "block" : "none";
    }

    applyTabSettings();
</script>
