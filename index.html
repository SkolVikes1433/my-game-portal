<!DOCTYPE html>
<html>
<head>
    <title>My Game Site</title>

    <style>
        body {
            margin: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            background: #111;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #39ff14;
        }

        h1 {
            color: #39ff14;
            margin: 0;
        }

        .search {
            margin-top: 15px;
            padding: 10px;
            width: 250px;
            border-radius: 8px;
            border: none;
        }

        .section {
            padding: 20px;
        }

        .section h2 {
            color: #39ff14;
        }

      .games {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

 .game {
    background: #111;
    border: 1px solid #39ff14;
    border-radius: 8px;
    padding: 10px;
    width: 120px;
    text-align: center;
}

.game h3 {
    font-size: 14px;
    margin: 5px 0 10px;
}

.game button {
    background: #39ff14;
    color: black;
    border: none;
    padding: 6px 12px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    font-size: 12px;
}
    </style>
</head>

<body>

    <header>
        <h1>🎮 MY GAME SITE</h1>

        <input
            class="search"
            type="text"
            placeholder="Search games..."
        >
    </header>

    <div class="section">
        <h2>🔥 Most Recent Games</h2>

       <div class="games">

<div class="game">
    <h3>Slope</h3>
    <button onclick="openGame('https://example.com/game')">PLAY</button>
</div>

<div id="gameWindow" style="display:none;">
    <iframe id="gameFrame" width="100%" height="600"></iframe>
</div>

<script>
function openGame(url) {
    document.getElementById("gameWindow").style.display = "block";
    document.getElementById("gameFrame").src = url;
}
</script>
    <div class="game">
        <h3>Super Mario 64</h3>
        <button onclick="window.open('https://arkshocer.github.io/sm64/', '_blank')">
            PLAY
        </button>
    </div>

    <div class="game">
        <h3>Stickman Hook</h3>
        <button onclick="window.open('https://stickman-pi.vercel.app/', '_blank')">
            PLAY
        </button>
    </div>

</div>

    <div class="section">
        <h2>⚡ Action & Adventure</h2>

        <div class="games">

   <div class="game">
        <h3>Subway Surfers</h3>
        <button onclick="window.open('https://testingherokuapp.github.io/subwaysurfer/', '_blank')">PLAY</button>
    </div>

    <div class="game">
        <h3>Geometry Dash</h3>
        <button onclick="window.open('https://mecanixcreations.github.io/GeometryDashLite-unity-web/', '_blank')">PLAY</button>
    </div>

    <div class="game">
        <h3>Paper.io 2</h3>
        <button onclick="window.open('https://gameunblocked-2025.github.io/projects/paperio2/index.html', '_blank')">PLAY</button>
    </div>


</div>

        </div>
    </div>

</body>
</html>
