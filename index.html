
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Void Network V6</title>

    <link id="favicon" rel="icon" href="favicon.ico">

    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #05070b;
            color: #eaf3ff;
            font-family: 'Rajdhani', sans-serif;
        }

        header {
            background: #080c13;
            border-bottom: 2px solid #168cff;
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .logo {
            color: #168cff;
            font-size: 29px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        button, .nav-button {
            background: #101927;
            color: #eaf3ff;
            border: 1px solid #168cff;
            border-radius: 5px;
            padding: 10px 15px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
        }

        button:hover, .nav-button:hover {
            background: #168cff;
            color: #05070b;
        }

        .search-area {
            padding: 22px 24px 5px;
        }

        #search {
            width: 100%;
            max-width: 450px;
            padding: 12px;
            background: #0b111b;
            color: white;
            border: 1px solid #263b54;
            border-radius: 5px;
            font-family: inherit;
            font-size: 17px;
        }

        main {
            padding: 10px 24px 35px;
        }

        .category {
            margin-top: 20px;
        }

        .category h2 {
            color: #168cff;
            border-bottom: 1px solid #183550;
            padding-bottom: 8px;
            font-size: 23px;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
        }

        .game-card {
            background: #0b111b;
            border: 1px solid #1c2c40;
            color: #eaf3ff;
            padding: 14px 8px;
            text-align: center;
            border-radius: 5px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
        }

        .game-card:hover {
            border-color: #168cff;
        }

        #gameScreen {
            display: none;
            padding: 15px;
        }

        .game-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        #gameTitle {
            color: #168cff;
            font-size: 24px;
            font-weight: 700;
        }

        #gameFrame {
            width: 100%;
            height: 75vh;
            min-height: 400px;
            border: 1px solid #168cff;
            border-radius: 5px;
            background: black;
        }

        .footer {
            text-align: center;
            color: #52677f;
            padding: 20px;
        }

        @media (max-width: 600px) {
            header {
                padding: 14px;
            }

            main {
                padding: 10px 14px 30px;
            }

            .logo {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">VOID NETWORK V6</div>
    <a class="nav-button" href="settings.html">Tab Settings</a>
</header>

<div id="homeScreen">
    <div class="search-area">
        <input id="search" type="search"
            placeholder="Search games..."
            oninput="filterGames()">
    </div>

    <main>
        <section class="category">
            <h2>10 Most Recent Games</h2>

            <div class="game-grid">

                <button class="game-card" data-name="Gaming Escape"
                    onclick="openGame('Gaming Escape','https://badpiggies.global.ssl.fastly.net/index.html')">
                    Gaming Escape
                </button>

                <button class="game-card" data-name="Slope Ball"
                    onclick="openGame('Slope Ball','https://finnbaltazar1111.github.io/slope/')">
                    Slope Ball
                </button>

                <button class="game-card" data-name="Super Mario 64"
                    onclick="openGame('Super Mario 64','https://arkshocer.github.io/sm64/')">
                    Super Mario 64
                </button>

                <button class="game-card" data-name="Stickman Hook"
                    onclick="openGame('Stickman Hook','https://stickman-pi.vercel.app/')">
                    Stickman Hook
                </button>

                <button class="game-card" data-name="Subway Surfers"
                    onclick="openGame('Subway Surfers','https://testingherokuapp.github.io/subwaysurfer/')">
                    Subway Surfers
                </button>

                <button class="game-card" data-name="Geometry Dash"
                    onclick="openGame('Geometry Dash','https://mecanixcreations.github.io/GeometryDashLite-unity-web/')">
                    Geometry Dash
                </button>

                <button class="game-card" data-name="Paper IO 2"
                    onclick="openGame('Paper IO 2','https://gameunblocked-2025.github.io/projects/paperio2/index.html')">
                    Paper IO 2
                </button>

                <button class="game-card" data-name="Slow Roads"
                    onclick="openGame('Slow Roads','https://hackingschoolwebsites.github.io/slowroads/')">
                    Slow Roads
                </button>

                <button class="game-card" data-name="Time Shooter"
                    onclick="openGame('Time Shooter','https://unlocktheworld.github.io/Time-Shooter/index.html')">
                    Time Shooter
                </button>

                <button class="game-card" data-name="There Is No Game"
                    onclick="openGame('There Is No Game','https://unlocktheworld.github.io/There-is-no-game/index.html')">
                    There Is No Game
                </button>

                <button class="game-card" data-name="The Annoying Button"
                    onclick="openGame('The Annoying Button','https://unlocktheworld.github.io/bigredbutton/index.html')">
                    The Annoying Button
                </button>

            </div>
        </section>
    </main>

    <div class="footer">VOID NETWORK V6</div>
</div>

<div id="gameScreen">
    <div class="game-toolbar">
        <button onclick="backToGames()">← Back to Games</button>
        <span id="gameTitle">Game</span>
        <button onclick="fullscreenGame()">⛶ Fullscreen</button>
    </div>

    <iframe id="gameFrame"
        title="Game"
        allowfullscreen
        allow="fullscreen; gamepad; autoplay">
    </iframe>
</div>

<script>
    // Tab cloaking presets — keep these keys identical to settings.html.
    const cloakPresets = {
        "Default": {
            title: "Void Network V6",
            icon: "favicon.ico"
        },
        "Google": {
            title: "Google",
            icon: "https://cdn.jsdelivr.net/gh/gamebackup/gamebackup.github.io@main/images/googleiconv2.png"
        },
        "YouTube": {
            title: "YouTube",
            icon: "https://www.youtube.com/s/desktop/2f549df7/img/favicon_32x32.png"
        },
        "Canvas": {
            title: "Dashboard",
            icon: "https://du11hjcvx0uqb.cloudfront.net/br/dist/images/favicon-e10d657a73.ico"
        },
        "Khan": {
            title: "Khan Academy",
            icon: "https://cdn.kastatic.org/images/favicon.ico"
        },
        "Docs": {
            title: "Google Docs",
            icon: "https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico"
        },
        "Desmos": {
            title: "Desmos | Graphing Calculator",
            icon: "https://www.desmos.com/favicon.ico"
        },
        "Drive": {
            title: "My Drive - Google Drive",
            icon: "https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png"
        },
        "Google Classroom": {
            title: "Home - Classroom",
            icon: "https://edu.google.com/images/svg/gsuite-icons/classroom.svg"
        },
        "XtraMath": {
            title: "XtraMath",
            icon: "https://cdn.prod.website-files.com/62db0786ca1a5127000f16e6/68f393b6311816a40a8da3c6_XM-FAVICON.png"
        }
    };

    function applyTabCloak() {
        const savedKey = localStorage.getItem("userCloak") || "Default";
        const customTitle = localStorage.getItem("customTabTitle");
        const preset = cloakPresets[savedKey];

        const favicon = document.getElementById("favicon");

        if (customTitle) {
            document.title = customTitle;
        } else if (preset) {
            document.title = preset.title;
        }

        if (preset && favicon) {
            favicon.href = preset.icon;
        }
    }

    function openGame(name, url) {
        document.getElementById("homeScreen").style.display = "none";
        document.getElementById("gameScreen").style.display = "block";
        document.getElementById("gameTitle").textContent = name;
        document.getElementById("gameFrame").src = url;
        window.scrollTo(0, 0);
    }

    function backToGames() {
        document.getElementById("gameFrame").src = "about:blank";
        document.getElementById("gameScreen").style.display = "none";
        document.getElementById("homeScreen").style.display = "block";
        document.getElementById("search").value = "";
        filterGames();
        window.scrollTo(0, 0);
    }

    function fullscreenGame() {
        const frame = document.getElementById("gameFrame");

        if (frame.requestFullscreen) {
            frame.requestFullscreen();
        } else if (frame.webkitRequestFullscreen) {
            frame.webkitRequestFullscreen();
        }
    }

    function filterGames() {
        const query = document.getElementById("search").value.toLowerCase();

        document.querySelectorAll(".game-card").forEach(card => {
            card.style.display =
                card.dataset.name.toLowerCase().includes(query) ? "" : "none";
        });
    }

    // Apply the saved tab title and icon whenever the main page loads.
    applyTabCloak();
</script>

</body>
</html>
