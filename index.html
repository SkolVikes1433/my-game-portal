
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#05070b">
  <title>VOID NETWORK V6</title>
  <link rel="icon" href="./void-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #05070b;
      --panel: #0b111b;
      --blue: #168cff;
      --text: #eaf3ff;
      --muted: #9badc4;
      --border: #183b60;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding: 18px 5%;
      background: #080d15;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-family: 'Black Ops One', cursive;
      font-size: clamp(19px, 3vw, 27px);
      color: var(--text);
      text-decoration: none;
      letter-spacing: 1px;
    }

    nav { display: flex; gap: 10px; flex-wrap: wrap; }

    nav a, .btn {
      display: inline-block;
      padding: 10px 15px;
      border: 1px solid var(--blue);
      border-radius: 7px;
      background: #0b1726;
      color: var(--text);
      font: 700 16px 'Rajdhani', sans-serif;
      text-decoration: none;
      cursor: pointer;
    }

    nav a:hover, .btn:hover, .game-card:hover {
      background: #102b47;
      box-shadow: 0 0 14px #168cff35;
    }

    main { width: min(1200px, 92%); margin: 35px auto; }

    .hero {
      padding: 30px 20px;
      text-align: center;
      background: linear-gradient(145deg, #0c1726, #070b12);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 30px;
    }

    h1 {
      font: clamp(30px, 6vw, 48px) 'Black Ops One', cursive;
      margin: 0 0 8px;
      text-shadow: 0 0 18px #168cff50;
    }

    .hero p { color: var(--muted); font-size: 19px; margin: 0; }

    .toolbar { margin-bottom: 22px; }

    #search {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #080d15;
      color: var(--text);
      font: 600 18px 'Rajdhani', sans-serif;
      outline: none;
    }

    #search:focus { border-color: var(--blue); }

    h2 {
      font: 25px 'Black Ops One', cursive;
      margin: 20px 0;
    }

    #gameGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
      gap: 13px;
    }

    .game-card {
      min-height: 78px;
      padding: 14px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      font: 700 18px 'Rajdhani', sans-serif;
      cursor: pointer;
      overflow-wrap: anywhere;
      transition: .15s;
    }

    .game-card:focus-visible, button:focus-visible, a:focus-visible {
      outline: 2px solid #8bcaff;
      outline-offset: 3px;
    }

    #noResults { display: none; color: var(--muted); font-size: 19px; }

    #gameScreen { display: none; }

    .game-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 14px;
    }

    .game-heading h2 { margin: 0; }

    .player {
      overflow: hidden;
      border: 1px solid var(--blue);
      border-radius: 9px;
      background: #000;
    }

    #gameFrame {
      display: block;
      width: 100%;
      height: 75vh;
      min-height: 400px;
      border: 0;
      background: #000;
    }

    footer {
      margin-top: 45px;
      padding: 22px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      text-align: center;
      letter-spacing: 2px;
    }

    @media (max-width: 600px) {
      header { padding: 15px 4%; }
      main { margin-top: 22px; }
      #gameGrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      #gameFrame { height: 65vh; min-height: 350px; }
      .game-heading { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="index.html">VOID NETWORK V6</a>
    <nav>
      <a href="index.html">Games</a>
      <a href="settings.html"> Tab Settings</a>
    </nav>
  </header>

  <main>
    <section id="homeScreen">
      <div class="hero">
        <h1>GAME PORTAL</h1>
        <p>Some things dont work were working on it.</p>
      </div>

      <div class="toolbar">
        <input id="search" type="search" placeholder="Search games..." aria-label="Search games">
      </div>

      <h2>ALL GAMES</h2>
      <div id="gameGrid"></div>
      <p id="noResults">No games found. Try another search.</p>
    </section>

    <section id="gameScreen">
      <div class="game-heading">
        <h2 id="gameTitle">Game</h2>
        <div>
          <button class="btn" id="backButton">← Back to Games</button>
          <button class="btn" id="fullscreenButton">Fullscreen</button>
        </div>
      </div>
      <div class="player" id="player">
        <iframe id="gameFrame" src="about:blank"
          title="Game player"
          allow="fullscreen; autoplay; gamepad"
          allowfullscreen></iframe>
      </div>
    </section>
  </main>

  <footer>VOID NETWORK V6</footer>

  <script>
    const PRESETS = {
      "Default": {
        title: "VOID NETWORK V6",
        icon: "./void-logo.png"
      },
      "Khan Academy": {
        title: "Khan Academy",
        icon: "https://cdn.kastatic.org/images/favicon.ico"
      },
      "Google": {
        title: "Google",
        icon: "https://www.google.com/favicon.ico"
      },
      "YouTube": {
        title: "YouTube",
        icon: "https://www.youtube.com/favicon.ico"
      },
      "Google Docs": {
        title: "Google Docs",
        icon: "https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico"
      },
      "Desmos": {
        title: "Desmos",
        icon: "https://www.desmos.com/favicon.ico"
      },
      "Google Drive": {
        title: "Google Drive",
        icon: "https://drive.google.com/favicon.ico"
      },
      "Google Classroom": {
        title: "Home - Classroom",
        icon: "https://ssl.gstatic.com/classroom/favicon.png"
      },
      "XtraMath": {
        title: "XtraMath",
        icon: "https://xtramath.org/favicon.ico"
      }
    };

    function applyPreset(name) {
      const preset = PRESETS[name] || PRESETS.Default;
      document.title = preset.title;

      let icon = document.querySelector('link[rel="icon"]');
      if (!icon) {
        icon = document.createElement("link");
        icon.rel = "icon";
        document.head.appendChild(icon);
      }
      icon.href = preset.icon;
    }

    function loadPreset() {
      const saved = localStorage.getItem("userCloak") || "Default";
      applyPreset(saved);
    }

    loadPreset();
    window.addEventListener("pageshow", loadPreset);
    window.addEventListener("storage", event => {
      if (event.key === "userCloak" || event.key === null) loadPreset();
    });

    const games = [
      ["Gaming Escape", "https://badpiggies.global.ssl.fastly.net/index.html"],
      ["Super Mario 64", "https://arkshocer.github.io/sm64/"],
      ["Stickman Hook", "https://stickman-pi.vercel.app/"],
      ["Subway Surfers", "https://testingherokuapp.github.io/subwaysurfer/"],
      ["Geo Dash", "https://mecanixcreations.github.io/GeometryDashLite-unity-web/"],
      ["Paper IO 2", "https://gameunblocked-2025.github.io/projects/paperio2/index.html"],
      ["Slow Roads", "https://hackingschoolwebsites.github.io/slowroads/"],
      ["Time Shooter", "https://unlocktheworld.github.io/Time-Shooter/index.html"],
      ["There Is No Game", "https://unlocktheworld.github.io/There-is-no-game/index.html"],
      ["The Annoying Button", "https://unlocktheworld.github.io/bigredbutton/index.html"],
      ["Super Mario Bros Deluxe", "https://gamebackup.github.io/emu_games/games/super_mario_bros_deluxe/"],
      ["FNF", "https://gamebackup.github.io/standalone_games/fnf/"],
      ["Portal 2D", "https://gamebackup.github.io/flash_games/games/portal2d/"],
      ["Deal Or No Deal", "https://unlocktheworld.github.io/deal-or-no-deal/index.html"],
      ["Tanuki Sunset", "https://gamebackup.github.io/standalone_games/tanukisunset/"],
      ["Doge Miner 1", "https://unlocktheworld.github.io/DogeMiner/index.html"],
      ["Doge Miner 2", "https://unlocktheworld.github.io/Dogeminer2/index.html"],
      ["Retro Bowl", "https://gamebackup.github.io/standalone_games/retro%20bowl/"],
      ["Drive Mad", "https://unlocktheworld.github.io/drive-mad/index.html"],
      ["Mario Kart", "https://gamebackup.github.io/standalone_games/supermariokart/"],
      ["Unfair Mario", "https://unlocktheworld.github.io/unfair-mario/index.html"],
      ["Mario Party", "https://gamebackup.github.io/emu_games/games/mario-party/"],
      ["Mario Kart 64", "https://gamebackup.github.io/emu_games/games/mario-kart-64/"],
      ["Super Mario Bros", "https://gamebackup.github.io/emu_games/games/super-mario-bros/"],
      ["Paper Mario", "https://gamebackup.github.io/emu_games/games/paper-mario/"],
      ["Mario Kart Super Circuit", "https://gamebackup.github.io/emu_games/games/mario-kart-super-circuit/"],
      ["MK49", "https://mk49.cyou/"],
      ["Smash Karts", "https://unlocktheworld.github.io/smash-karts/index.html"],
      ["Doodle Jump", "https://unlocktheworld.github.io/doodle-jump/index.html"],
      ["1v1 LOL", "https://unlocktheworld.github.io/1v1-lol/index.html"],
      ["Temple Run", "https://unlocktheworld.github.io/temple-run/index.html"],
      ["Tiny Fishing", "https://majesticwafer.github.io/tiny-fishing/"],
      ["Snow Rider 3D", "https://itsvijaysingh.github.io/Snow-Rider3D/"],
      ["Hacker Typing", "https://tanksapka.github.io/hacker-typer/"],
      ["Chrome Dino", "https://map-l.github.io/play/dino/"],
      ["Granny", "https://map-l.github.io/play/granny/"],
      ["Tomb of the Mask", "https://map-l.github.io/play/tomb-of-the-mask/"],
      ["Escape Road", "https://escaperoadx.github.io/"],
      ["FNAF 1", "https://dorukyum.github.io/FNAF-Web/"],
      ["FNAF 2", "https://sussygamedeveloper.github.io/FNAF2/"],
      ["Cookie Clicker", "https://ozh.github.io/cookieclicker/"],
      ["Cluster Rush", "https://ethanyo.freetls.fastly.net/misc/cluster-rush/index.html"],
      ["Block Blast", "https://reunbozdo.github.io/"],
      ["Flappy Bird", "https://thorium.rocks/games/flappy-bird/"],
      ["Crazy Cattle", "https://crazycattle3d.github.io/"],
      ["Snake Game", "https://mohdriyaan.github.io/snake-game/"],
      ["Minecraft", "https://astraclientorg.github.io/play/wasm/18/"],
      ["Xbox Cloud Gaming", "https://www.xbox.com/en-US/play"],
      ["Wheelie Life", "https://scratch.mit.edu/projects/1231016758/embed"],
      ["We Become What We Behold", "https://webecomewhatwebehold.github.io/#google_vignette"],
      ["Notflix 2.0", "https://docs.google.com/presentation/d/1zpAdr_JhbDVscrOgxY1dgiW4Z6blgoU_eqcN_7m8bY0/edit#slide=id.g3950afba0ed_0_0"]
    ];

    const grid = document.getElementById("gameGrid");
    const search = document.getElementById("search");
    const homeScreen = document.getElementById("homeScreen");
    const gameScreen = document.getElementById("gameScreen");
    const gameFrame = document.getElementById("gameFrame");
    const gameTitle = document.getElementById("gameTitle");
    const noResults = document.getElementById("noResults");

    function renderGames(filter = "") {
      grid.replaceChildren();
      const term = filter.trim().toLowerCase();
      const matches = games.filter(([name]) => name.toLowerCase().includes(term));

      matches.forEach(([name, url]) => {
        const button = document.createElement("button");
        button.className = "game-card";
        button.textContent = name;
        button.addEventListener("click", () => openGame(name, url));
        grid.appendChild(button);
      });

      noResults.style.display = matches.length ? "none" : "block";
    }

    function openGame(name, url) {
      gameTitle.textContent = name;
      gameFrame.src = url;
      homeScreen.style.display = "none";
      gameScreen.style.display = "block";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function backToGames() {
      gameFrame.src = "about:blank";
      gameScreen.style.display = "none";
      homeScreen.style.display = "block";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    search.addEventListener("input", () => renderGames(search.value));
    document.getElementById("backButton").addEventListener("click", backToGames);

    document.getElementById("fullscreenButton").addEventListener("click", async () => {
      const player = document.getElementById("player");
      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else {
          await player.requestFullscreen();
        }
      } catch {
        alert("Fullscreen is not available for this game in your browser.");
      }
    });

    renderGames();
  </script>
</body>
</html>
