
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOID NETWORK V6 | Tab Settings</title>
<link rel="icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #05070b;
    color: #eaf3ff;
    font-family: 'Rajdhani', sans-serif;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    padding: 18px 22px;
    background: #080d15;
    border-bottom: 2px solid #168cff;
}

.logo, h2 {
    font-family: 'Black Ops One', cursive;
    color: #168cff;
}

.logo { margin: 0; font-size: 25px; }

nav {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.nav-button {
    padding: 10px 14px;
    background: #0b1420;
    color: white;
    border: 1px solid #168cff;
    border-radius: 4px;
    text-decoration: none;
    cursor: pointer;
    font-size: 16px;
}

.nav-button:hover { background: #168cff; color: black; }

main {
    max-width: 1100px;
    margin: auto;
    padding: 24px;
}

h2 { margin-top: 0; }

.description { color: #a1b0c3; }

.panel {
    padding: 20px;
    margin-bottom: 22px;
    background: #080d15;
    border: 1px solid #1c2c40;
    border-radius: 5px;
}

.preset-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
    gap: 12px;
}

.preset {
    min-height: 120px;
    padding: 12px 8px;
    background: #0b111b;
    color: #eaf3ff;
    border: 1px solid #1c2c40;
    border-radius: 5px;
    cursor: pointer;
    font: 700 16px 'Rajdhani', sans-serif;
    overflow-wrap: anywhere;
}

.preset:hover {
    background: #101d2e;
    border-color: #168cff;
}

.preset.selected {
    border: 2px solid #168cff;
    background: #10213a;
    box-shadow: 0 0 12px #168cff33;
}

.logo-container {
    height: 48px;
    width: 48px;
    margin: 0 auto 10px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.logo-container img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.logo-fallback {
    display: none;
    width: 46px;
    height: 46px;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    background: #10213a;
    border: 1px solid #168cff;
    color: #55b2ff;
    font: bold 24px Arial, sans-serif;
}

label {
    display: block;
    margin: 14px 0 6px;
    font-weight: 700;
    font-size: 17px;
}

input {
    width: 100%;
    padding: 12px;
    color: white;
    background: #0b111b;
    border: 1px solid #243a53;
    border-radius: 4px;
    font: 16px 'Rajdhani', sans-serif;
}

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 18px;
}

.action-button {
    padding: 10px 16px;
    color: white;
    background: #0b1420;
    border: 1px solid #168cff;
    border-radius: 4px;
    cursor: pointer;
    font: 700 16px 'Rajdhani', sans-serif;
}

.action-button:hover { background: #168cff; color: black; }

#status {
    min-height: 24px;
    margin-top: 12px;
    color: #70e6a0;
}

.back {
    color: #55b2ff;
    text-decoration: none;
    font-size: 17px;
}

@media (max-width: 600px) {
    header { padding: 15px; }
    main { padding: 15px; }
    .preset-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>
</head>

<body>
<header>
    <h1 class="logo">VOID NETWORK V6</h1>
    <nav>
        <a class="nav-button" href="index.html">Games</a>
        <a class="nav-button" href="settings.html">⚙ Tab Settings</a>
    </nav>
</header>

<main>
    <section class="panel">
        <h2>Tab Cloaker</h2>
        <p class="description">Choose a tab title and icon.</p>
        <div class="preset-grid" id="presetGrid"></div>
    </section>

    <section class="panel">
        <h2>Custom Tab</h2>
        <p class="description">Set your own tab title and icon URL.</p>

        <label for="customTitle">Tab title</label>
        <input id="customTitle" type="text" placeholder="Enter tab title">

        <label for="customIcon">Icon URL</label>
        <input id="customIcon" type="url" placeholder="Enter an icon image URL">

        <div class="actions">
            <button class="action-button" id="saveCustom" type="button">Save Custom Tab</button>
            <button class="action-button" id="reset" type="button">Reset Settings</button>
        </div>

        <div id="status" role="status" aria-live="polite"></div>
    </section>

    <a class="back" href="index.html">← Back to Hub</a>
</main>

<script>
/* EXACT SAME PRESET IDS, TITLES, AND ICON URLS AS index.html */
const presets = [
    {
        id: "Default",
        name: "Default",
        title: "Void Network V6",
        icon: "favicon.ico",
        letter: "V"
    },
    {
        id: "Khan",
        name: "Khan Academy",
        title: "Khan Academy",
        icon: "https://cdn.kastatic.org/images/favicon.ico",
        letter: "K"
    },
    {
        id: "Google",
        name: "Google",
        title: "Google",
        icon: "https://cdn.jsdelivr.net/gh/gamebackup/gamebackup.github.io@main/images/googleiconv2.png",
        letter: "G"
    },
    {
        id: "YouTube",
        name: "YouTube",
        title: "YouTube",
        icon: "https://www.youtube.com/s/desktop/2f549df7/img/favicon_32x32.png",
        letter: "Y"
    },
    {
        id: "Canvas",
        name: "Canvas",
        title: "Dashboard",
        icon: "https://du11hjcvx0uqb.cloudfront.net/br/dist/images/favicon-e10d657a73.ico",
        letter: "C"
    },
    {
        id: "Docs",
        name: "Google Docs",
        title: "Google Docs",
        icon: "https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico",
        letter: "D"
    },
    {
        id: "Desmos",
        name: "Desmos",
        title: "Desmos | Graphing Calculator",
        icon: "https://www.desmos.com/favicon.ico",
        letter: "D"
    },
    {
        id: "Drive",
        name: "Google Drive",
        title: "My Drive - Google Drive",
        icon: "https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png",
        letter: "D"
    },
    {
        id: "Google Classroom",
        name: "Google Classroom",
        title: "Home - Classroom",
        icon: "https://edu.google.com/images/svg/gsuite-icons/classroom.svg",
        letter: "C"
    },
    {
        id: "XtraMath",
        name: "XtraMath",
        title: "XtraMath",
        icon: "https://cdn.prod.website-files.com/62db0786ca1a5127000f16e6/68f393b6311816a40a8da3c6_XM-FAVICON.png",
        letter: "X"
    }
];

const grid = document.getElementById("presetGrid");
const status = document.getElementById("status");
const titleInput = document.getElementById("customTitle");
const iconInput = document.getElementById("customIcon");

function readStorage(key, fallback = "") {
    try {
        return localStorage.getItem(key) ?? fallback;
    } catch (error) {
        return fallback;
    }
}

function writeSettings(id, title, icon) {
    try {
        localStorage.setItem("userCloak", id);
        localStorage.setItem("customTabTitle", title);
        localStorage.setItem("selectedTabIcon", icon);
        return true;
    } catch (error) {
        status.textContent = "Could not save settings in this browser.";
        return false;
    }
}

function updateSelected() {
    const selected = readStorage("userCloak", "Default");

    document.querySelectorAll(".preset").forEach(button => {
        const active = button.dataset.id === selected;
        button.classList.toggle("selected", active);
        button.setAttribute("aria-pressed", String(active));
    });
}

function selectPreset(preset) {
    if (!writeSettings(preset.id, preset.title, preset.icon)) return;

    titleInput.value = preset.title;
    iconInput.value = preset.icon;

    updateSelected();
    status.textContent = preset.name + " selected and saved.";
}

function createPreset(preset) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "preset";
    button.dataset.id = preset.id;

    const logoContainer = document.createElement("div");
    logoContainer.className = "logo-container";

    const img = document.createElement("img");
    img.alt = preset.name + " logo";
    img.loading = "eager";
    img.referrerPolicy = "no-referrer";

    const fallback = document.createElement("span");
    fallback.className = "logo-fallback";
    fallback.textContent = preset.letter;

    function showFallback() {
        img.style.display = "none";
        fallback.style.display = "flex";
    }

    img.addEventListener("error", showFallback);
    img.addEventListener("load", () => {
        img.style.display = "block";
        fallback.style.display = "none";
    });

    img.src = preset.icon;
    logoContainer.append(img, fallback);

    const label = document.createElement("span");
    label.textContent = preset.name;

    button.append(logoContainer, label);
    button.addEventListener("click", () => selectPreset(preset));

    grid.appendChild(button);
}

presets.forEach(createPreset);

titleInput.value = readStorage("customTabTitle");
iconInput.value = readStorage("selectedTabIcon");
updateSelected();

document.getElementById("saveCustom").addEventListener("click", () => {
    const title = titleInput.value.trim();
    const icon = iconInput.value.trim();

    if (!title) {
        status.textContent = "Enter a tab title first.";
        return;
    }

    if (icon) {
        try {
            const url = new URL(icon);
            if (!["https:", "http:"].includes(url.protocol)) {
                status.textContent = "Use a valid HTTP or HTTPS icon URL.";
                return;
            }
        } catch {
            status.textContent = "That icon URL is not valid.";
            return;
        }
    }

    if (writeSettings("Custom", title, icon)) {
        updateSelected();
        status.textContent = "Custom tab settings saved.";
    }
});

document.getElementById("reset").addEventListener("click", () => {
    const defaultPreset = presets.find(preset => preset.id === "Default");
    selectPreset(defaultPreset);
});
</script>
</body>
</html>
