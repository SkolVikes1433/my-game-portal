
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Void Network V6</title>
<link id="favicon" rel="icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #05070b;
    color: #eaf3ff;
    font-family: 'Rajdhani', sans-serif;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    padding: 18px 22px;
    background: #080d15;
    border-bottom: 2px solid #168cff;
}

.logo, h2, .category-title {
    font-family: 'Black Ops One', cursive;
    color: #168cff;
}

.logo { margin: 0; font-size: 25px; }

nav, .game-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.nav-button, .action-button {
    padding: 10px 14px;
    background: #0b1420;
    color: white;
    border: 1px solid #168cff;
    border-radius: 4px;
    text-decoration: none;
    cursor: pointer;
    font-family: 'Rajdhani', sans-serif;
    font-size: 16px;
}

.nav-button:hover, .action-button:hover {
    background: #168cff;
    color: black;
}

main { max-width: 1250px; margin: auto; padding: 24px; }
.intro p, .note { color: #a1b0c3; }

#search {
    width: 100%;
    padding: 13px;
    margin: 12px 0 20px;
    color: white;
    background: #0b111b;
    border: 1px solid #243a53;
    border-radius: 4px;
    font-size: 16px;
}

.game-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
    gap: 10px;
}

.game-card {
    min-height: 55px;
    padding: 12px 8px;
    color: #eaf3ff;
    background: #0b111b;
    border: 1px solid #1c2c40;
    border-radius: 4px;
    cursor: pointer;
    font-family: 'Black Ops One', cursive;
    font-size: 12px;
    overflow-wrap: anywhere;
}

.game-card:hover {
    background: #101d2e;
    border-color: #168cff;
}

#noResults { display: none; color: #a1b0c3; }
#gameScreen { display: none; padding: 16px; }

.game-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 12px;
}

#gameTitle { margin: 0; font-size: 20px; }

#gameFrame {
    display: block;
    width: 100%;
    height: 75vh;
    min-height: 400px;
    background: black;
    border: 1px solid #168cff;
    border-radius: 4px;
}

footer {
    padding: 24px;
    margin-top: 30px;
    text-align: center;
    color: #66778c;
    border-top: 1px solid #172536;
}

@media (max-width: 600px) {
    header { padding: 15px; }
    main { padding: 15px; }
    .game-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    #gameFrame { height: 65vh; min-height: 350px; }
}
</style>
</head>

<body>
<header>
    <h1 class="logo">VOID NETWORK V6</h1>
    <nav>
        <a class="nav-button" href="index.html">Games</a>
        <a class="nav-button" href="settings.html">⚙ Tab Settings</a>
    </nav>
</header>

<main id="homeScreen">
    <section class="intro">
        <h2>GAME PORTAL</h2>
        <p>Select a game below to play.</p>
    </section>

    <input id="search" type="search" placeholder="Search games..." aria-label="Search games">

    <h3 class="category-title">ALL GAMES</h3>
    <div class="game-grid" id="gameGrid"></div>
    <p id="noResults">No games found. Try another search.</p>
</main>

<section id="gameScreen">
    <div class="game-toolbar">
        <h2 id="gameTitle">Game</h2>
        <div class="game-actions">
            <button class="action-button" id="backButton">← Back to Games</button>
            <button class="action-button" id="fullscreenButton">Fullscreen</button>
        </div>
    </div>

    <iframe id="gameFrame" src="about:blank" title="Game player"
        allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>

    <p class="note">Some game websites block embedded play, so a few games may not load inside the portal.</p>
</section>

<footer>VOID NETWORK V6</footer>

};

function applyTabSettings() {
    let selected = "Default";
    let customTitle = "";
    let savedIcon = "";

    try {
        selected = localStorage.getItem("userCloak") || "Default";
        customTitle = localStorage.getItem("customTabTitle") || "";
        savedIcon = localStorage.getItem("selectedTabIcon") || "";
    } catch (error) {}

    const preset = tabPresets[selected] || tabPresets.Default;

    document.title = customTitle.trim() || preset.title;

    let favicon = document.getElementById("favicon");

    if (!favicon) {
        favicon = document.createElement("link");
        favicon.id = "favicon";
        favicon.rel = "icon";
        document.head.appendChild(favicon);
    }

    favicon.href = savedIcon || preset.icon;
}

function renderGames() {
    const grid = document.getElementById("gameGrid");

    games.forEach(([name, url]) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "game-card";
        button.textContent = name;
        button.dataset.name = name.toLowerCase();
        button.addEventListener("click", () => openGame(name, url));
        grid.appendChild(button);
    });
}

function filterGames() {
    const query = document.getElementById("search").value.toLowerCase().trim();
    let visibleCount = 0;

    document.querySelectorAll(".game-card").forEach(button => {
        const matches = button.dataset.name.includes(query);
        button.style.display = matches ? "" : "none";
        if (matches) visibleCount++;
    });

    document.getElementById("noResults").style.display =
        visibleCount ? "none" : "block";
}

function openGame(name, url) {
    document.getElementById("homeScreen").style.display = "none";
    document.getElementById("gameScreen").style.display = "block";
    document.getElementById("gameTitle").textContent = name;
    document.getElementById("gameFrame").src = url;
    window.scrollTo(0, 0);
}

function backToGames() {
    document.getElementById("gameFrame").src = "about:blank";
    document.getElementById("gameScreen").style.display = "none";
    document.getElementById("homeScreen").style.display = "block";
    window.scrollTo(0, 0);
}

function fullscreenGame() {
    const frame = document.getElementById("gameFrame");

    if (document.fullscreenElement) {
        document.exitFullscreen();
    } else if (frame.requestFullscreen) {
        frame.requestFullscreen();
    }
}

document.getElementById("search").addEventListener("input", filterGames);
document.getElementById("backButton").addEventListener("click", backToGames);
document.getElementById("fullscreenButton").addEventListener("click", fullscreenGame);

renderGames();
applyTabSettings();

window.addEventListener("pageshow", applyTabSettings);
window.addEventListener("storage", applyTabSettings);
</script>
</body>
</html>
