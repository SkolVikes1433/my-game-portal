<!DOCTYPE html>
<html>
<head>
    <title>My Game Portal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
        }

        /* TOP BAR */
        header {
            height: 65px;
            background: #050505;
            border-bottom: 2px solid #39ff14;
            display: flex;
            align-items: center;
            padding: 0 20px;
        }

        header h1 {
            color: #39ff14;
            font-size: 22px;
            margin: 0;
        }

        /* MAIN GAME LIST */
        #homeScreen {
            padding: 25px;
        }

        .category {
            margin-bottom: 35px;
        }

        .category h2 {
            color: #39ff14;
            font-size: 22px;
            margin-bottom: 12px;
        }

        .games {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* SMALL GAME BUTTONS */
        .gameButton {
            background: #111;
            color: white;
            border: 1px solid #39ff14;
            border-radius: 6px;
            padding: 10px 14px;
            cursor: pointer;
            font-size: 14px;
        }

        .gameButton:hover {
            background: #39ff14;
            color: black;
        }

        /* GAME SCREEN */
        #gameScreen {
            display: none;
            height: calc(100vh - 65px);
            background: #000;
            flex-direction: column;
        }

        /* GAME CONTROLS */
        .gameControls {
            height: 55px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: #080808;
            border-bottom: 1px solid #39ff14;
        }

        .controlButton {
            background: #111;
            color: white;
            border: 1px solid #39ff14;
            border-radius: 5px;
            padding: 9px 14px;
            cursor: pointer;
        }

        .controlButton:hover {
            background: #39ff14;
            color: black;
        }

        /* GAME */
        #gameFrame {
            width: 100%;
            height: calc(100vh - 120px);
            border: none;
            background: black;
        }
    </style>
</head>

<body>

    <!-- MAIN HEADER -->
    <header>
        <h1>MY GAME PORTAL</h1>
    </header>


    <!-- ===================== -->
    <!-- MAIN GAME LIST -->
    <!-- ===================== -->

    <div id="homeScreen">

        <div class="category">
            <h2>⭐ Popular Games</h2>

            <div class="games">
              <button class="gameButton"
    onclick="openGame('Slope', 'https://finnbaltazar1111.github.io/slope/')">
    Slope
</button>

<button class="gameButton"
    onclick="openGame('Stickman Hook', 'https://stickman-pi.vercel.app/')">
    Stickman Hook
</button>

<button class="gameButton"
    onclick="openGame('Subway Surfers', 'https://testingherokuapp.github.io/subwaysurfer/')">
    Subway Surfers
</button>

<button class="gameButton"
    onclick="openGame('Geometry Dash', 'https://mecanixcreations.github.io/GeometryDashLite-unity-web/')">
    Geometry Dash
</button>

<button class="gameButton"
    onclick="openGame('Paper IO 2', 'https://gameunblocked-2025.github.io/projects/paperio2/index.html')">
    Paper IO 2
</button>

<button class="gameButton"
    onclick="openGame('Slow Roads', 'https://hackingschoolwebsites.github.io/slowroads/')">
    Slow Roads
</button>

                <button class="gameButton"
                    onclick="openGame('Game Name', 'GAME-LINK-HERE')">
                    Game Name
                </button>

                <button class="gameButton"
                    onclick="openGame('Another Game', 'GAME-LINK-HERE')">
                    Another Game
                </button>

                <button class="gameButton"
                    onclick="openGame('Slope', 'GAME-LINK-HERE')">
                    Slope
                </button>

            </div>
        </div>


        <div class="category">
            <h2>🏎️ Racing & Driving</h2>

            <div class="games">

                <button class="gameButton"
                    onclick="openGame('Snow Rider 3D', 'GAME-LINK-HERE')">
                    Snow Rider 3D
                </button>

                <button class="gameButton"
                    onclick="openGame('Drive Mad', 'GAME-LINK-HERE')">
                    Drive Mad
                </button>

            </div>
        </div>


        <div class="category">
            <h2>🎮 Platformers</h2>

            <div class="games">

                <button class="gameButton"
                    onclick="openGame('Subway Surfers', 'GAME-LINK-HERE')">
                    Subway Surfers
                </button>

                <button class="gameButton"
                    onclick="openGame('Geometry Dash', 'GAME-LINK-HERE')">
                    Geometry Dash
                </button>

            </div>
        </div>

    </div>


    <!-- ===================== -->
    <!-- GAME SCREEN -->
    <!-- ===================== -->

    <div id="gameScreen">

        <div class="gameControls">

            <button class="controlButton" onclick="goHome()">
                ← Back to Games
            </button>

            <button class="controlButton" onclick="fullscreenGame()">
                ⛶ Fullscreen
            </button>

            <span id="gameTitle"></span>

        </div>

        <iframe
            id="gameFrame"
            allowfullscreen>
        </iframe>

    </div>


    <!-- ===================== -->
    <!-- JAVASCRIPT -->
    <!-- ===================== -->

    <script>

        function openGame(name, url) {

            document.getElementById("homeScreen").style.display = "none";

            document.getElementById("gameScreen").style.display = "flex";

            document.getElementById("gameTitle").textContent = name;

            document.getElementById("gameFrame").src = url;
        }


        function goHome() {

            document.getElementById("gameFrame").src = "";

            document.getElementById("gameScreen").style.display = "none";

            document.getElementById("homeScreen").style.display = "block";
        }


        function fullscreenGame() {

            const game = document.getElementById("gameFrame");

            if (game.requestFullscreen) {
                game.requestFullscreen();
            }

        }

    </script>

</body>
</html>
