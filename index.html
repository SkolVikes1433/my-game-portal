
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOID NETWORK V6</title>
<link id="tabIcon" rel="icon" href="./void-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{margin:0;background:#05070b;color:#eaf3ff;font-family:'Rajdhani',sans-serif;font-size:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;padding:18px 24px;background:#060a12;border-bottom:1px solid #243b56}
.brand{display:flex;align-items:center;gap:12px;color:#168cff;font:24px 'Black Ops One',cursive}
.brand img{width:42px;height:42px;object-fit:contain}
nav{display:flex;gap:10px}
a.nav-button,button{border:1px solid #315579;background:#101b2b;color:#eaf3ff;padding:11px 16px;border-radius:9px;font:700 17px 'Rajdhani',sans-serif;text-decoration:none;cursor:pointer}
a.nav-button:hover,button:hover{border-color:#168cff;background:#122b46}
main{width:min(1100px,94%);margin:32px auto}
h1,h2{color:#49a8ff;font-family:'Black Ops One',cursive}
h1{font-size:clamp(27px,4vw,40px)}
.subtitle{color:#b7cbe2}
.search{width:100%;margin:16px 0 28px;padding:14px;border:1px solid #294563;border-radius:9px;outline:none;background:#0b111b;color:#eaf3ff;font:18px 'Rajdhani',sans-serif}
.search:focus{border-color:#168cff}
#gameGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.game-button{min-height:60px;overflow-wrap:anywhere}
#noResults{color:#a9bad0}
#gameScreen{display:none}
.game-toolbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:18px 0}
#gameFrame{display:block;width:100%;height:75vh;min-height:400px;border:1px solid #294563;border-radius:10px;background:#000}
footer{text-align:center;color:#647c96;border-top:1px solid #18283a;margin-top:50px;padding:24px}
@media(max-width:600px){
 header{padding:14px}
 .brand{font-size:19px}
 nav{width:100%}
 nav a{flex:1;text-align:center}
 #gameGrid{grid-template-columns:repeat(2,minmax(0,1fr))}
 #gameFrame{height:65vh;min-height:350px}
}
</style>
</head>

<body>
<header>
  <div class="brand">
    <img src="./void-logo.png" alt="">
    <span>VOID NETWORK V6</span>
  </div>
  <nav>
    <a class="nav-button" href="./index.html">Games</a>
    <a class="nav-button" href="./settings.html">Settings</a>
  </nav>
</header>

<main>
  <section id="homeScreen">
    <h1>GAME PORTAL</h1>
    <p class="subtitle">Still in Development please be patient if some things dont work were working on it.</p>
    <input id="searchInput" class="search" type="search" placeholder="Search games..." aria-label="Search games">
    <h2>ALL GAMES</h2>
    <div id="gameGrid"></div>
    <p id="noResults" hidden>No games found. Try another search.</p>
  </section>

  <section id="gameScreen">
    <h2 id="gameTitle">Game</h2>
    <div class="game-toolbar">
      <button id="backButton" type="button">← Back to Games</button>
      <button id="fullscreenButton" type="button">Fullscreen</button>
    </div>
    <iframe id="gameFrame" src="about:blank" allow="fullscreen; autoplay; gamepad" allowfullscreen title="Game"></iframe>
  </section>
</main>

<footer>VOID NETWORK V6</footer>

<script>
const PRESETS = {

    title: "VOID NETWORK V6",
    icon: "./void-logo.png"
  },
  "Khan Academy": {
    title: "Khan Academy",
    icon: "https://cdn.kastatic.org/images/favicon.ico"
  },
  "Google": {
    title: "Google",
    icon: "https://www.google.com/favicon.ico"
  },
  "YouTube": {
    title: "YouTube",
    icon: "https://www.youtube.com/favicon.ico"
  },
  "Google Docs": {
    title: "Google Docs",
    icon: "https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico"
  },
  "Desmos": {
    title: "Desmos",
    icon: "https://www.desmos.com/favicon.ico"
  },
  "Google Drive": {
    title: "Google Drive",
    icon: "https://drive.google.com/favicon.ico"
  },
  "Google Classroom": {
    title: "Home - Classroom",
    icon: "https://ssl.gstatic.com/classroom/favicon.png"
  },
  "XtraMath": {
    title: "XtraMath",
    icon: "https://xtramath.org/favicon.ico"
  }
};

function applyTabSettings(){
  let selected="Default";
  try{selected=localStorage.getItem("userCloak")||"Default"}catch(e){}
  if(!Object.prototype.hasOwnProperty.call(PRESETS,selected))selected="Default";
  document.title=PRESETS[selected].title;
  document.getElementById("tabIcon").href=PRESETS[selected].icon;
}
applyTabSettings();
window.addEventListener("pageshow",applyTabSettings);
window.addEventListener("storage",applyTabSettings);

const games=[
["Gaming Escape","https://badpiggies.global.ssl.fastly.net/index.html"],
["Super Mario 64","https://arkshocer.github.io/sm64/"],
["Stickman Hook","https://stickman-pi.vercel.app/"],
["Subway Surfers","https://testingherokuapp.github.io/subwaysurfer/"],
["Geo Dash","https://mecanixcreations.github.io/GeometryDashLite-unity-web/"],
["Paper IO 2","https://gameunblocked-2025.github.io/projects/paperio2/index.html"],
["Slow Roads","https://hackingschoolwebsites.github.io/slowroads/"],
["Time Shooter","https://unlocktheworld.github.io/Time-Shooter/index.html"],
["There Is No Game","https://unlocktheworld.github.io/There-is-no-game/index.html"],
["The Annoying Button","https://unlocktheworld.github.io/bigredbutton/index.html"],

["FNF","https://gamebackup.github.io/standalone_games/fnf/"],

["Deal Or No Deal","https://unlocktheworld.github.io/deal-or-no-deal/index.html"],
["Tanuki Sunset","https://gamebackup.github.io/standalone_games/tanukisunset/"],
["Doge Miner 1","https://unlocktheworld.github.io/DogeMiner/index.html"],
["Doge Miner 2","https://unlocktheworld.github.io/Dogeminer2/index.html"],
["Retro Bowl","https://gamebackup.github.io/standalone_games/retro%20bowl/"],
["Drive Mad","https://unlocktheworld.github.io/drive-mad/index.html"],
["Mario Kart","https://gamebackup.github.io/standalone_games/supermariokart/"],
["Unfair Mario","https://unlocktheworld.github.io/unfair-mario/index.html"],
["Mario Party","https://gamebackup.github.io/emu_games/games/mario_party/"],
["Mario Kart 64","https://gamebackup.github.io/emu_games/games/mario_kart_64/"],
["Super Mario Bros","https://gamebackup.github.io/emu_games/games/super_mario_bros/"],

["Notflix 2.0","https://docs.google.com/presentation/d/1zpAdr_JhbDVscrOgxY1dgiW4Z6blgoU_eqcN_7m8bY0/edit"]
];

const gameGrid=document.getElementById("gameGrid");
const searchInput=document.getElementById("searchInput");
const noResults=document.getElementById("noResults");
const homeScreen=document.getElementById("homeScreen");
const gameScreen=document.getElementById("gameScreen");
const gameFrame=document.getElementById("gameFrame");

function renderGames(filter=""){
  gameGrid.replaceChildren();
  const query=filter.trim().toLowerCase();
  const filtered=games.filter(([name])=>name.toLowerCase().includes(query));
  filtered.forEach(([name,url])=>{
    const button=document.createElement("button");
    button.className="game-button";
    button.type="button";
    button.textContent=name;
    button.addEventListener("click",()=>{
      document.getElementById("gameTitle").textContent=name;
      gameFrame.src=url;
      homeScreen.style.display="none";
      gameScreen.style.display="block";
      window.scrollTo({top:0,behavior:"smooth"});
    });
    gameGrid.appendChild(button);
  });
  noResults.hidden=filtered.length>0;
}
searchInput.addEventListener("input",()=>renderGames(searchInput.value));
document.getElementById("backButton").addEventListener("click",()=>{
  gameFrame.src="about:blank";
  gameScreen.style.display="none";
  homeScreen.style.display="block";
});
document.getElementById("fullscreenButton").addEventListener("click",async()=>{
  try{await gameFrame.requestFullscreen()}catch(e){
    alert("Fullscreen is not available for this game in this browser.");
  }
});
renderGames();
</script>
</body>
</html>
