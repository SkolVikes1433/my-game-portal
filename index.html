}

@media (max-width: 600px) {
    header {
        padding: 15px;
    }

    main {
        padding: 15px;
    }

    .game-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    #gameFrame {
        height: 65vh;
        min-height: 350px;
    }
}
</style>
</head>

<body>

<header>
    <h1 class="logo">VOID NETWORK V6</h1>

    <nav>
        <a class="nav-button" href="index.html">Games</a>
        <a class="nav-button" href="settings.html">Tab Settings</a>
    </nav>
</header>

<main id="homeScreen">
    <section class="intro">
        <h2>GAME PORTAL</h2>
        <p>Select a game below to play.</p>
    </section>

    <input
        id="search"
        type="search"
        placeholder="Search games..."
        aria-label="Search games"
        oninput="filterGames()"
    >

    <h3 class="category-title">ALL GAMES</h3>

    <div class="game-grid" id="gameGrid"></div>

    <p id="noResults">No games found. Try another search.</p>
</main>

<section id="gameScreen">
    <div class="game-toolbar">
        <h2 id="gameTitle">Game</h2>

        <div class="game-actions">
            <button class="action-button" onclick="backToGames()">
                ← Back to Games
            </button>

            <button class="action-button" onclick="fullscreenGame()">
                Fullscreen
            </button>

            <button class="action-button" onclick="openGameInNewTab()">
                Open Website
            </button>
        </div>
    </div>

    <iframe
        id="gameFrame"
        src="about:blank"
        title="Game player"
        allow="fullscreen; autoplay; gamepad"
        allowfullscreen>
    </iframe>

    <p class="note">
        If a game does not load, its website may block iframe embedding.
        Use Open Website to try it directly.
    </p>
</section>

<footer>VOID NETWORK V6</footer>

<script>
/* ALL YOUR GAME LINKS */
const games = [
    ["Gaming Escape", "https://badpiggies.global.ssl.fastly.net/index.html"],

];

let currentGameUrl = "";

/* Build game buttons from the list above. */
function renderGames() {
    const grid = document.getElementById("gameGrid");
    grid.replaceChildren();

    games.forEach(function(game) {
        const button = document.createElement("button");
        button.className = "game-card";
        button.dataset.name = game[0];
        button.textContent = game[0];
        button.type = "button";

        button.addEventListener("click", function() {
            openGame(game[0], game[1]);
        });

        grid.appendChild(button);
    });
}

/* TAB CLOAK SETTINGS
   Uses the same localStorage keys as the settings page:
   userCloak, customTabTitle, and selectedTabIcon.
*/
function applyTabSettings() {
    const presets = {
        "Default": {
            title: "Void Network V6",
            icon: "favicon.ico"
        },
        "Google": {
            title: "Google",
            icon: "https://www.google.com/favicon.ico"
        },
        "YouTube": {
            title: "YouTube",
            icon: "https://www.youtube.com/s/desktop/2f549df7/img/favicon_32x32.png"
        },
        "Canvas": {
            title: "Dashboard",
            icon: "https://du11hjcvx0uqb.cloudfront.net/br/dist/images/favicon-e10d657a73.ico"
        },
        "Khan": {
            title: "Khan Academy",
            icon: "https://cdn.kastatic.org/images/favicon.ico"
        },
        "Docs": {
            title: "Google Docs",
            icon: "https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico"
        },
        "Desmos": {
            title: "Desmos | Graphing Calculator",
            icon: "https://www.desmos.com/favicon.ico"
        },
        "Drive": {
            title: "My Drive - Google Drive",
            icon: "https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png"
        },
        "Google Classroom": {
            title: "Home - Classroom",
            icon: "https://edu.google.com/images/svg/gsuite-icons/classroom.svg"
        },
        "XtraMath": {
            title: "XtraMath",
            icon: "https://cdn.prod.website-files.com/62db0786ca1a5127000f16e6/68f393b6311816a40a8da3c6_XM-FAVICON.png"
        }
    };

    const selected = localStorage.getItem("userCloak") || "Default";
    const preset = presets[selected] || presets["Default"];
    const customTitle = localStorage.getItem("customTabTitle");
    const savedIcon = localStorage.getItem("selectedTabIcon");

    document.title = customTitle && customTitle.trim()
        ? customTitle.trim()
        : preset.title;

    const favicon = document.getElementById("favicon");

    if (favicon) {
        favicon.href = savedIcon || preset.icon;
    }
}

/* Open a game in the on-page player. */
function openGame(name, url) {
    currentGameUrl = url;

    document.getElementById("homeScreen").style.display = "none";
    document.getElementById("gameScreen").style.display = "block";
    document.getElementById("gameTitle").textContent = name;
    document.getElementById("gameFrame").src = url;

    window.scrollTo(0, 0);
}

/* Open the selected game's original website in another tab. */
function openGameInNewTab() {
    if (currentGameUrl) {
        window.open(currentGameUrl, "_blank", "noopener,noreferrer");
    }
}

/* Return to the game library. */
function backToGames() {
    document.getElementById("gameFrame").src = "about:blank";
    document.getElementById("gameScreen").style.display = "none";
    document.getElementById("homeScreen").style.display = "block";
    currentGameUrl = "";

    window.scrollTo(0, 0);
}

/* Fullscreen player. */
function fullscreenGame() {
    const frame = document.getElementById("gameFrame");

    if (frame.requestFullscreen) {
        frame.requestFullscreen();
    } else if (frame.webkitRequestFullscreen) {
        frame.webkitRequestFullscreen();
    }
}

/* Search games by name. */
function filterGames() {
    const query = document.getElementById("search")
        .value.toLowerCase().trim();

    const cards = document.querySelectorAll(".game-card");
    let count = 0;

    cards.forEach(function(card) {
        const matches = card.dataset.name.toLowerCase().includes(query);
        card.style.display = matches ? "" : "none";

        if (matches) {
            count++;
        }
    });

    document.getElementById("noResults").style.display =
        count === 0 ? "block" : "none";
}

/* Initialize the hub. */
renderGames();
applyTabSettings();

/* Reapply tab settings when returning to this page. */
window.addEventListener("pageshow", applyTabSettings);

document.addEventListener("visibilitychange", function() {
    if (!document.hidden) {
        applyTabSettings();
    }
});

window.addEventListener("storage", applyTabSettings);
</script>

</body>
