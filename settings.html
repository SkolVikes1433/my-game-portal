
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOID NETWORK V6 | Settings</title>
  <link id="settingsFavicon" rel="icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #05070d;
      color: #eaf4ff;
      font-family: 'Rajdhani', sans-serif;
      background-image:
        radial-gradient(ellipse at top, #10264b 0%, transparent 55%),
        linear-gradient(#05070d, #080b13);
    }

    header {
      padding: 25px 18px;
      text-align: center;
      border-bottom: 1px solid #19385e;
      background: rgba(3, 6, 13, .9);
    }

    h1 {
      margin: 0;
      color: #48a9ff;
      font: 32px 'Black Ops One', cursive;
      letter-spacing: 2px;
      text-shadow: 0 0 18px #087cff66;
    }

    header p {
      margin: 8px 0 0;
      color: #9bb5d6;
      font-size: 17px;
    }

    main {
      width: min(1000px, 94%);
      margin: 30px auto;
    }

    .panel {
      background: #0a111e;
      border: 1px solid #1b3555;
      border-radius: 15px;
      padding: 22px;
      margin-bottom: 22px;
      box-shadow: 0 10px 35px #0005;
    }

    h2 {
      margin: 0 0 8px;
      color: #55b2ff;
      font-size: 25px;
    }

    .description {
      margin: 0 0 20px;
      color: #9cb2ce;
      font-size: 17px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
      gap: 12px;
    }

    .preset {
      min-width: 0;
      min-height: 125px;
      padding: 15px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 9px;
      color: #eaf4ff;
      background: #101b2c;
      border: 1px solid #263e5d;
      border-radius: 12px;
      cursor: pointer;
      font: 700 17px 'Rajdhani', sans-serif;
      transition: .18s ease;
    }

    .preset:hover {
      border-color: #43a5ff;
      background: #142945;
      transform: translateY(-2px);
    }

    .preset.selected {
      border: 2px solid #42a5ff;
      background: #102b49;
      box-shadow: 0 0 18px #168bff30;
    }

    .logo-box {
      width: 55px;
      height: 55px;
      flex: 0 0 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
    }

    .logo-box img {
      display: block;
      width: 100%;
      height: 100%;
      padding: 5px;
      object-fit: contain;
    }

    .fallback {
      color: #1674d1;
      font: bold 25px Arial, sans-serif;
    }

    .preset-name {
      text-align: center;
      overflow-wrap: anywhere;
    }

    label {
      display: block;
      color: #b7cce5;
      font-size: 17px;
      font-weight: 700;
      margin: 14px 0 6px;
    }

    input {
      display: block;
      width: 100%;
      padding: 12px 13px;
      color: white;
      background: #050b15;
      border: 1px solid #294362;
      border-radius: 8px;
      font: 17px 'Rajdhani', sans-serif;
      outline: none;
    }

    input:focus { border-color: #48a9ff; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .action {
      border: 1px solid #358de0;
      border-radius: 8px;
      padding: 11px 20px;
      background: #1476cf;
      color: white;
      cursor: pointer;
      font: 700 18px 'Rajdhani', sans-serif;
    }

    .action:hover { background: #258fe9; }

    .secondary {
      background: #121d2d;
      border-color: #30445f;
    }

    #status {
      min-height: 25px;
      margin-top: 12px;
      color: #71e6a2;
      font-size: 17px;
    }

    .back {
      display: inline-block;
      margin-top: 8px;
      color: #72bdff;
      font-size: 18px;
      text-decoration: none;
    }

    .back:hover { text-decoration: underline; }

    @media (max-width: 450px) {
      h1 { font-size: 25px; }
      .panel { padding: 15px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>

<body>
  <header>
    <h1>VOID NETWORK V6</h1>
    <p>Tab Cloaker Settings</p>
  </header>

  <main>
    <section class="panel">
      <h2>Choose a Tab Icon</h2>
      <p class="description">
        Select a preset to change the browser tab title and icon.
      </p>
      <div class="grid" id="presetGrid"></div>
    </section>

    <section class="panel">
      <h2>Custom Tab</h2>
      <p class="description">
        Enter a custom browser tab title and an optional icon image URL.
      </p>

      <label for="customTitle">Tab title</label>
      <input
        id="customTitle"
        type="text"
        placeholder="Example: Google Classroom"
        maxlength="100"
      >

      <label for="customIcon">Icon image URL</label>
      <input
        id="customIcon"
        type="url"
        placeholder="https://example.com/icon.png"
      >

      <div class="actions">
        <button class="action" id="saveCustom" type="button">
          Save Custom Tab
        </button>
        <button class="action secondary" id="reset" type="button">
          Reset Settings
        </button>
      </div>

      <div id="status" role="status" aria-live="polite"></div>
    </section>

    <a class="back" href="index.html">← Back to Hub</a>
  </main>

  <script>
    // Keep these IDs, titles, and URLs synchronized with index.html.
    const presets = [
      {
        id: "Default",
        name: "Default",
        title: "Void Network V6",
        icon: "favicon.ico",
        letter: "V"
      },
      {
        id: "Khan",
        name: "Khan Academy",
        title: "Khan Academy",
        icon: "https://cdn.kastatic.org/images/favicon.ico",
        letter: "K"
      },
      {
        id: "Google",
        name: "Google",
        title: "Google",
        icon: "https://cdn.jsdelivr.net/gh/gamebackup/gamebackup.github.io@main/images/googleiconv2.png",
        letter: "G"
      },
      {
        id: "YouTube",
        name: "YouTube",
        title: "YouTube",
        icon: "https://www.youtube.com/s/desktop/2f549df7/img/favicon_32x32.png",
        letter: "Y"
      },
      {
        id: "Canvas",
        name: "Canvas",
        title: "Dashboard",
        icon: "https://du11hjcvx0uqb.cloudfront.net/br/dist/images/favicon-e10d657a73.ico",
        letter: "C"
      },
      {
        id: "Docs",
        name: "Google Docs",
        title: "Google Docs",
        icon: "https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico",
        letter: "D"
      },
      {
        id: "Desmos",
        name: "Desmos",
        title: "Desmos | Graphing Calculator",
        icon: "https://www.desmos.com/favicon.ico",
        letter: "D"
      },
      {
        id: "Drive",
        name: "Google Drive",
        title: "My Drive - Google Drive",
        icon: "https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png",
        letter: "D"
      },
      {
        id: "Google Classroom",
        name: "Google Classroom",
        title: "Home - Classroom",
        icon: "https://edu.google.com/images/svg/gsuite-icons/classroom.svg",
        letter: "C"
      },
      {
        id: "XtraMath",
        name: "XtraMath",
        title: "XtraMath",
        icon: "https://cdn.prod.website-files.com/62db0786ca1a5127000f16e6/68f393b6311816a40a8da3c6_XM-FAVICON.png",
        letter: "X"
      }
    ];

    const grid = document.getElementById("presetGrid");
    const status = document.getElementById("status");
    const titleInput = document.getElementById("customTitle");
    const iconInput = document.getElementById("customIcon");

    let selectedId = localStorage.getItem("userCloak") || "Default";

    function showStatus(message) {
      status.textContent = message;
    }

    function renderPresets() {
      grid.replaceChildren();

      presets.forEach(preset => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "preset";
        button.dataset.id = preset.id;
        button.setAttribute("aria-pressed", "false");

        const logoBox = document.createElement("span");
        logoBox.className = "logo-box";

        const fallback = document.createElement("span");
        fallback.className = "fallback";
        fallback.textContent = preset.letter;

        if (preset.icon) {
          fallback.hidden = true;

          const img = document.createElement("img");
          img.alt = "";
          img.loading = "eager";
          img.decoding = "async";
          img.referrerPolicy = "no-referrer";
          img.src = preset.icon;

          img.addEventListener("error", () => {
            img.hidden = true;
            fallback.hidden = false;
          });

          img.addEventListener("load", () => {
            img.hidden = false;
            fallback.hidden = true;
          });

          logoBox.appendChild(img);
        }

        logoBox.appendChild(fallback);

        const name = document.createElement("span");
        name.className = "preset-name";
        name.textContent = preset.name;

        button.append(logoBox, name);
        button.addEventListener("click", () => selectPreset(preset.id));

        grid.appendChild(button);
      });

      updateSelectedStyle();
    }

    function updateSelectedStyle() {
      document.querySelectorAll(".preset").forEach(button => {
        const selected = button.dataset.id === selectedId;
        button.classList.toggle("selected", selected);
        button.setAttribute("aria-pressed", String(selected));
      });
    }

    function fillCustomFields(title, icon) {
      titleInput.value = title || "";
      iconInput.value = icon || "";
    }

    function selectPreset(id) {
      const preset = presets.find(item => item.id === id);
      if (!preset) return;

      selectedId = preset.id;

      localStorage.setItem("userCloak", preset.id);
      localStorage.setItem("customTabTitle", preset.title);
      localStorage.setItem("selectedTabIcon", preset.icon);

      fillCustomFields(preset.title, preset.icon);
      updateSelectedStyle();

      showStatus(
        preset.name + " saved. Open or refresh the hub to apply the tab settings."
      );
    }

    document.getElementById("saveCustom").addEventListener("click", () => {
      const title = titleInput.value.trim();
      const icon = iconInput.value.trim();

      if (!title) {
        showStatus("Please enter a tab title.");
        titleInput.focus();
        return;
      }

      if (icon) {
        try {
          const url = new URL(icon);

          if (url.protocol !== "https:" && url.protocol !== "http:") {
            showStatus("The icon URL must start with http:// or https://.");
            return;
          }
        } catch {
          showStatus("Please enter a valid icon image URL.");
          iconInput.focus();
          return;
        }
      }

      selectedId = "Custom";
      localStorage.setItem("userCloak", "Custom");
      localStorage.setItem("customTabTitle", title);
      localStorage.setItem("selectedTabIcon", icon);

      updateSelectedStyle();
      showStatus("Custom tab settings saved. Return to the hub to apply them.");
    });

    document.getElementById("reset").addEventListener("click", () => {
      selectPreset("Default");
    });

    function loadSavedSettings() {
      const savedTitle = localStorage.getItem("customTabTitle");
      const savedIcon = localStorage.getItem("selectedTabIcon");

      if (savedTitle !== null || savedIcon !== null) {
        fillCustomFields(savedTitle, savedIcon);
      } else {
        fillCustomFields("", "");
      }

      const savedId = localStorage.getItem("userCloak") || "Default";
      selectedId = savedId;

      updateSelectedStyle();
    }

    renderPresets();
    loadSavedSettings();
  </script>
</body>
</html>
