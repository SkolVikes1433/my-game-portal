
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tab Settings</title>
<link id="favicon" rel="icon" type="image/png" href="./void-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#05070d;color:#eaf4ff;font-family:Rajdhani,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:18px 24px;background:#03060d;border-bottom:1px solid #19385e}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:42px;height:42px;object-fit:contain}
h1{margin:0;color:#48a9ff;font:24px 'Black Ops One',cursive}
nav{display:flex;flex-wrap:wrap;gap:10px}
nav a,.action{padding:10px 15px;color:#eaf4ff;background:#101b2c;border:1px solid #2b5682;border-radius:8px;text-decoration:none;font:700 16px Rajdhani,sans-serif;cursor:pointer}
nav a:hover,.action:hover{background:#17406a;border-color:#48a9ff}
main{width:min(950px,94%);margin:30px auto}
.panel{padding:22px;margin-bottom:22px;background:#0a111e;border:1px solid #1b3555;border-radius:12px}
h2{margin:0 0 8px;color:#55b2ff;font-size:25px}
.description{margin:0 0 20px;color:#9cb2ce;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px}
.preset{min-height:120px;padding:14px 8px;color:#eaf4ff;background:#101b2c;border:1px solid #263e5d;border-radius:10px;cursor:pointer;font:700 17px Rajdhani,sans-serif}
.preset:hover{background:#142945;border-color:#43a5ff}
.preset.selected{border:2px solid #42a5ff;background:#102b49}
.badge{display:flex;align-items:center;justify-content:center;width:48px;height:48px;margin:0 auto 9px;border-radius:12px;background:#eaf4ff;color:#1266bd;font:bold 25px Arial,sans-serif}
.preset[data-id="YouTube"] .badge{background:#f22;color:white}
.preset[data-id="Default"] .badge{background:#0c1c30;color:#48a9ff;border:1px solid #48a9ff}
#status{min-height:24px;margin-top:16px;color:#71e6a2;font-size:17px}
.back{display:inline-block;color:#72bdff;font-size:18px;text-decoration:none}
.back:hover{text-decoration:underline}
@media(max-width:500px){header{padding:15px}h1{font-size:19px}.panel{padding:15px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="./void-logo.png" alt="Void Network logo">
    <h1>VOID NETWORK V6</h1>
  </div>
  <nav>
    <a href="./index.html">🎮 Games</a>
    <a href="./settings.html">⚙ Settings</a>
  </nav>
</header>

<main>
  <section class="panel">
    <h2>Tab Cloaker</h2>
    <p class="description">Choose a button to change the browser tab title and icon. Your choice is saved automatically.</p>
    <div class="grid" id="presetGrid"></div>
    <div id="status" role="status" aria-live="polite"></div>
  </section>
  <a class="back" href="./index.html">← Back to Hub</a>
</main>

<script>
const presets=[
{id:"Default",name:"Default",title:"VOID NETWORK V6",icon:"./void-logo.png",letter:"V"},
{id:"Khan",name:"Khan Academy",title:"Khan Academy",icon:"https://cdn.kastatic.org/images/favicon.ico",letter:"K"},
{id:"Google",name:"Google",title:"Google",icon:"https://www.google.com/favicon.ico",letter:"G"},
{id:"YouTube",name:"YouTube",title:"YouTube",icon:"https://www.youtube.com/s/desktop/2f549df7/img/favicon_32x32.png",letter:"▶"},
{id:"Canvas",name:"Canvas",title:"Canvas",icon:"https://du11hjcvx0uqb.cloudfront.net/br/dist/images/favicon-e10d657a73.ico",letter:"C"},
{id:"Docs",name:"Google Docs",title:"Google Docs",icon:"https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico",letter:"D"},
{id:"Desmos",name:"Desmos",title:"Desmos",icon:"https://www.desmos.com/favicon.ico",letter:"D"},
{id:"Drive",name:"Google Drive",title:"Google Drive",icon:"https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png",letter:"D"},
{id:"Google Classroom",name:"Google Classroom",title:"Google Classroom",icon:"https://classroom.google.com/favicon.ico",letter:"C"},
{id:"XtraMath",name:"XtraMath",title:"XtraMath",icon:"https://xtramath.org/favicon.ico",letter:"X"}
];

const grid=document.getElementById("presetGrid");
const status=document.getElementById("status");
let selectedId="Default";

try{
  selectedId=localStorage.getItem("userCloak")||"Default";
}catch(error){}

function updateSelection(){
  document.querySelectorAll(".preset").forEach(button=>{
    const selected=button.dataset.id===selectedId;
    button.classList.toggle("selected",selected);
    button.setAttribute("aria-pressed",String(selected));
  });
}

function choosePreset(id){
  const preset=presets.find(item=>item.id===id);
  if(!preset)return;

  selectedId=id;

  try{
    localStorage.setItem("userCloak",preset.id);
    localStorage.setItem("customTabTitle",preset.title);
    localStorage.setItem("selectedTabIcon",preset.icon);
  }catch(error){
    status.textContent="Your browser blocked saving settings. Check your browser storage permissions.";
    return;
  }

  document.title=preset.title;
  document.getElementById("favicon").href=preset.icon;
  updateSelection();
  status.textContent=preset.name+" selected and saved. Your hub will use this tab setting.";
}

presets.forEach(preset=>{
  const button=document.createElement("button");
  button.type="button";
  button.className="preset";
  button.dataset.id=preset.id;
  button.setAttribute("aria-pressed","false");

  const badge=document.createElement("span");
  badge.className="badge";
  badge.textContent=preset.letter;

  const name=document.createElement("span");
  name.textContent=preset.name;

  button.append(badge,name);
  button.addEventListener("click",()=>choosePreset(preset.id));
  grid.appendChild(button);
});

if(!presets.some(item=>item.id===selectedId))selectedId="Default";
updateSelection();
</script>
</body>
</html>
