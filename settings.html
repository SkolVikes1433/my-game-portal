
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOID NETWORK V6 | Settings</title>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #05070d;
      color: #eaf4ff;
      font-family: 'Rajdhani', sans-serif;
      background-image:
        radial-gradient(ellipse at top, #10264b 0%, transparent 55%),
        linear-gradient(#05070d, #080b13);
    }

    header {
      padding: 25px 18px;
      text-align: center;
      border-bottom: 1px solid #19385e;
      background: rgba(3, 6, 13, .9);
    }

    h1 {
      margin: 0;
      color: #48a9ff;
      font: 32px 'Black Ops One', cursive;
      letter-spacing: 2px;
      text-shadow: 0 0 18px #087cff66;
    }

    header p {
      margin: 8px 0 0;
      color: #9bb5d6;
      font-size: 17px;
    }

    main {
      width: min(1000px, 94%);
      margin: 30px auto;
    }

    .panel {
      background: #0a111e;
      border: 1px solid #1b3555;
      border-radius: 15px;
      padding: 22px;
      margin-bottom: 22px;
      box-shadow: 0 10px 35px #0005;
    }

    h2 {
      margin: 0 0 8px;
      color: #55b2ff;
      font-size: 25px;
    }

    .description {
      margin: 0 0 20px;
      color: #9cb2ce;
      font-size: 17px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
      gap: 12px;
    }

    .preset {
      min-height: 125px;
      padding: 15px 8px;
      color: #eaf4ff;
      background: #101b2c;
      border: 1px solid #263e5d;
      border-radius: 12px;
      cursor: pointer;
      font: 700 17px 'Rajdhani', sans-serif;
      transition: .18s ease;
    }

    .preset:hover {
      border-color: #43a5ff;
      background: #142945;
      transform: translateY(-2px);
    }

    .preset.selected {
      border: 2px solid #42a5ff;
      background: #102b49;
      box-shadow: 0 0 18px #168bff30;
    }

    .logo-box {
      height: 55px;
      width: 55px;
      margin: 0 auto 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
    }

    .logo-box img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 5px;
    }

    .fallback {
      display: none;
      color: #1674d1;
      font: bold 25px Arial, sans-serif;
    }

    label {
      display: block;
      color: #b7cce5;
      font-size: 17px;
      font-weight: 700;
      margin: 14px 0 6px;
    }

    input {
      display: block;
      width: 100%;
      padding: 12px 13px;
      color: white;
      background: #050b15;
      border: 1px solid #294362;
      border-radius: 8px;
      font: 17px 'Rajdhani', sans-serif;
      outline: none;
    }

    input:focus { border-color: #48a9ff; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .action {
      border: 1px solid #358de0;
      border-radius: 8px;
      padding: 11px 20px;
      background: #1476cf;
      color: white;
      cursor: pointer;
      font: 700 18px 'Rajdhani', sans-serif;
    }

    .action:hover { background: #258fe9; }

    .secondary {
      background: #121d2d;
      border-color: #30445f;
    }

    #status {
      min-height: 25px;
      margin-top: 12px;
      color: #71e6a2;
      font-size: 17px;
    }

    .back {
      display: inline-block;
      margin-top: 8px;
      color: #72bdff;
      font-size: 18px;
      text-decoration: none;
    }

    .back:hover { text-decoration: underline; }

    @media (max-width: 450px) {
      h1 { font-size: 25px; }
      .panel { padding: 15px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <header>
    <h1>VOID NETWORK V6</h1>
    <p>Tab Cloaker Settings</p>
  </header>

  <main>
    <section class="panel">
      <h2>Choose a Tab Icon</h2>
      <p class="description">
        Select a preset to change the browser tab title and icon.
      </p>
      <div class="grid" id="presetGrid"></div>
    </section>

    <section class="panel">
      <h2>Custom Tab</h2>
      <p class="description">
        Enter a custom browser tab title and an optional icon image URL.
      </p>

      <label for="customTitle">Tab title</label>
      <input id="customTitle" type="text" placeholder="Example: Google Classroom">

      <label for="customIcon">Icon image URL</label>
      <input id="customIcon" type="url" placeholder="https://example.com/icon.png">

      <div class="actions">
        <button class="action" id="saveCustom">Save Custom Tab</button>
        <button class="action secondary" id="reset">Reset Settings</button>
      </div>
      <div id="status" role="status" aria-live="polite"></div>
    </section>

    <a class="back" href="index.html">← Back to Hub</a>
  </main>

  <script>
    /*
      These use public image URLs. If an image fails to load,
      the button displays a letter instead of a broken-image box.
    */
    const presets = [
      {
        id: "Default",
        name: "Default",
        title: "VOID NETWORK V6",
        icon: "",
        letter: "V"
      },
      {
        id: "Khan",
        name: "Khan Academy",
        title: "Khan Academy",
        icon: "https://www.khanacademy.org/favicon.ico",
        letter: "K"
      },
      {
        id: "Google",
        name: "Google",
        title: "Google",
        icon: "https://www.google.com/favicon.ico",
        letter: "G"
      },
      {
        id: "YouTube",
        name: "YouTube",
        title: "YouTube",
        icon: "https://www.youtube.com/favicon.ico",
        letter: "▶"
      },
      {
        id: "Canvas",
        name: "Canvas",
        title: "Canvas",
        icon: "https://www.instructure.com/favicon.ico",
        letter: "C"
      },
      {
        id: "Docs",
        name: "Google Docs",
        title: "Google Docs",
        icon: "https://docs.google.com/favicon.ico",
        letter: "D"
      },
      {
        id: "Desmos",
        name: "Desmos",
        title: "Desmos",
        icon: "https://www.desmos.com/favicon.ico",
        letter: "D"
      },
      {
        id: "Drive",
        name: "Google Drive",
        title: "Google Drive",
        icon: "https://drive.google.com/favicon.ico",
        letter: "D"
      },
      {
        id: "Google Classroom",
        name: "Google Classroom",
        title: "Google Classroom",
        icon: "https://classroom.google.com/favicon.ico",
        letter: "C"
      },
      {
        id: "XtraMath",
        name: "XtraMath",
        title: "XtraMath",
        icon: "https://xtramath.org/favicon.ico",
        letter: "X"
      }
    ];

    const grid = document.getElementById("presetGrid");
    const status = document.getElementById("status");
    let selectedId = localStorage.getItem("userCloak") || "Default";

    function showStatus(message) {
      status.textContent = message;
    }

    function renderPresets() {
      grid.replaceChildren();

      presets.forEach(preset => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "preset";
        button.dataset.id = preset.id;
        button.setAttribute("aria-pressed", "false");

        const logoBox = document.createElement("span");
        logoBox.className = "logo-box";

        const fallback = document.createElement("span");
        fallback.className = "fallback";
        fallback.textContent = preset.letter;
        fallback.style.display = preset.icon ? "none" : "block";

        if (preset.icon) {
          const img = document.createElement("img");
          img.alt = preset.name + " logo";
          img.loading = "eager";
          img.referrerPolicy = "no-referrer";
          img.src = preset.icon;

          img.addEventListener("error", () => {
            img.style.display = "none";
            fallback.style.display = "block";
          });

          img.addEventListener("load", () => {
            img.style.display = "block";
            fallback.style.display = "none";
          });

          logoBox.appendChild(img);
        }

        logoBox.appendChild(fallback);

        const name = document.createElement("span");
        name.textContent = preset.name;

        button.append(logoBox, name);
        button.addEventListener("click", () => selectPreset(preset.id));

        grid.appendChild(button);
      });

      updateSelectedStyle();
    }

    function updateSelectedStyle() {
      document.querySelectorAll(".preset").forEach(button => {
        const isSelected = button.dataset.id === selectedId;
        button.classList.toggle("selected", isSelected);
        button.setAttribute("aria-pressed", String(isSelected));
      });
    }

    function selectPreset(id) {
      const preset = presets.find(item => item.id === id);
      if (!preset) return;

      selectedId = preset.id;

      localStorage.setItem("userCloak", preset.id);
      localStorage.setItem("customTabTitle", preset.title);
      localStorage.setItem("selectedTabIcon", preset.icon);

      document.getElementById("customTitle").value = preset.title;
      document.getElementById("customIcon").value = preset.icon;

      updateSelectedStyle();
      showStatus(preset.name + " selected and saved. Return to the hub to apply it.");
    }

    document.getElementById("saveCustom").addEventListener("click", () => {
      const title = document.getElementById("customTitle").value.trim();
      const icon = document.getElementById("customIcon").value.trim();

      if (!title) {
        showStatus("Please enter a tab title.");
        return;
      }

      if (icon) {
        try {
          const url = new URL(icon);
          if (url.protocol !== "https:" && url.protocol !== "http:") {
            showStatus("Use an HTTP or HTTPS image URL.");
            return;
          }
        } catch {
          showStatus("Please enter a valid icon image URL.");
          return;
        }
      }

      selectedId = "Custom";
      localStorage.setItem("userCloak", "Custom");
      localStorage.setItem("customTabTitle", title);
      localStorage.setItem("selectedTabIcon", icon);

      updateSelectedStyle();
      showStatus("Custom tab settings saved. Return to the hub to apply them.");
    });

    document.getElementById("reset").addEventListener("click", () => {
      selectPreset("Default");
      document.getElementById("customTitle").value = "";
      document.getElementById("customIcon").value = "";
      showStatus("Settings reset to Default.");
    });

    function loadSavedSettings() {
      const savedTitle = localStorage.getItem("customTabTitle") || "";
      const savedIcon = localStorage.getItem("selectedTabIcon") || "";

      document.getElementById("customTitle").value = savedTitle;
      document.getElementById("customIcon").value = savedIcon;

      if (!presets.some(preset => preset.id === selectedId)) {
        selectedId = "Default";
      }

      updateSelectedStyle();
    }

    renderPresets();
    loadSavedSettings();
  </script>
</body>
</html>
