<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settings - Void Network V6</title>

    <!-- This is the browser tab icon -->
    <link id="favicon" rel="icon" href="khan-academy.jpg">

    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #05070a;
            color: white;
            font-family: 'Rajdhani', sans-serif;
        }

        header {
            height: 70px;
            background: #080b10;
            border-bottom: 2px solid #168cff;
            display: flex;
            align-items: center;
            padding: 0 25px;
        }

        .logo {
            color: #168cff;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .settings {
            max-width: 600px;
            margin: 50px auto;
            padding: 25px;
            background: #0b0f15;
            border: 1px solid #168cff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(22, 140, 255, 0.2);
        }

        h1 {
            color: #168cff;
            margin-top: 0;
        }

        .label {
            font-size: 18px;
            font-weight: bold;
            margin: 25px 0 10px;
        }

        .khan-button {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 15px;

            padding: 12px;

            background: #05070a;
            color: white;

            border: 2px solid #168cff;
            border-radius: 8px;

            cursor: pointer;

            font-family: 'Rajdhani', sans-serif;
            font-size: 18px;
            font-weight: 700;
            text-align: left;
        }

        .khan-button:hover {
            background: #101923;
        }

        .khan-button.selected {
            box-shadow: 0 0 15px #168cff;
        }

        .khan-button img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            border-radius: 6px;
        }

        .back-button,
        .save-button {
            margin-top: 25px;
            padding: 11px 20px;
            border-radius: 6px;

            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 700;

            cursor: pointer;
        }

        .back-button {
            background: transparent;
            color: #168cff;
            border: 1px solid #168cff;
            margin-right: 8px;
        }

        .save-button {
            background: #168cff;
            color: black;
            border: none;
        }

        button:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">GAME PORTAL</div>
</header>

<div class="settings">

    <h1>⚙ SETTINGS</h1>

    <div class="label">
        Tab Icon
    </div>

    <!-- THE KHAN ACADEMY BUTTON -->
    <button
        class="khan-button"
        id="khanButton"
        onclick="selectKhan()"
    >
        <img src="khan-academy.jpg" alt="Khan Academy">

        <span>Khan Academy</span>
    </button>

    <br>

    <button
        class="back-button"
        onclick="goBack()"
    >
        ← BACK
    </button>

    <button
        class="save-button"
        onclick="saveSettings()"
    >
        SAVE SETTINGS
    </button>

</div>

<script>

    function selectKhan() {

        localStorage.setItem(
            "tabIcon",
            "khan-academy.jpg"
        );

        document
            .getElementById("khanButton")
            .classList.add("selected");

        applyIcon();

    }


    function applyIcon() {

        const favicon =
            document.getElementById("favicon");

        favicon.href = "khan-academy.jpg";

    }


    function saveSettings() {

        selectKhan();

        alert("Khan Academy selected!");

    }


    function goBack() {

        window.location.href = "index.html";

    }
function selectKhan() {
    localStorage.setItem("tabIcon", "khan-academy.jpg");

    let favicon = document.getElementById("favicon");

    if (!favicon) {
        favicon = document.createElement("link");
        favicon.id = "favicon";
        favicon.rel = "icon";
        document.head.appendChild(favicon);
    }

    favicon.href = "khan-academy.jpg";
}
</script>

</body>
</html>
