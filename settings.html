<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settings - Game Portal</title>

    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #05070a;
            color: white;
            font-family: 'Rajdhani', sans-serif;
        }

        header {
            height: 70px;
            background: #080b10;
            border-bottom: 2px solid #168cff;
            display: flex;
            align-items: center;
            padding: 0 25px;
        }

        .logo {
            color: #168cff;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .settings {
            max-width: 600px;
            margin: 50px auto;
            padding: 25px;
            background: #0b0f15;
            border: 1px solid #168cff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(22, 140, 255, 0.2);
        }

        h1 {
            color: #168cff;
            margin-top: 0;
            letter-spacing: 2px;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 7px;
            font-size: 17px;
        }

        input {
            width: 100%;
            padding: 10px;
            background: #05070a;
            color: white;
            border: 1px solid #168cff;
            border-radius: 5px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
        }

        .icon-option {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: #05070a;
            border: 1px solid #168cff;
            border-radius: 7px;
            cursor: pointer;
        }

        .icon-option:hover {
            background: #101923;
        }

        .icon-option img {
            width: 45px;
            height: 45px;
            object-fit: contain;
            border-radius: 5px;
        }

        .icon-name {
            font-size: 18px;
            font-weight: 600;
        }

        button {
            margin-top: 20px;
            background: #168cff;
            color: black;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #54b0ff;
        }

        .back {
            background: transparent;
            color: #168cff;
            border: 1px solid #168cff;
            margin-right: 8px;
        }

        .back:hover {
            background: #168cff;
            color: black;
        }

        .selected {
            outline: 2px solid #54b0ff;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">GAME PORTAL</div>
</header>

<div class="settings">

    <h1>⚙ SETTINGS</h1>

    <label for="titleInput">
        Tab Title
    </label>

    <input
        id="titleInput"
        type="text"
        placeholder="Game Portal"
    >

    <label>
        Tab Icon
    </label>

    <!-- KHAN ACADEMY -->
    <div
        class="icon-option selected"
        id="khanOption"
        onclick="selectKhan()"
    >
        <img src="khan-academy.jpg" alt="Khan Academy">

        <div class="icon-name">
            Khan Academy
        </div>
    </div>

    <br>

    <button class="back" onclick="goBack()">
        ← BACK
    </button>

    <button onclick="saveSettings()">
        SAVE SETTINGS
    </button>

</div>

<script>

    /* LOAD SAVED TITLE */
    const savedTitle = localStorage.getItem("tabTitle");

    if (savedTitle) {
        document.getElementById("titleInput").value = savedTitle;
    }


    /* SELECT KHAN ACADEMY */
    function selectKhan() {

        localStorage.setItem(
            "tabIcon",
            "khan-academy.jpg"
        );

        document
            .getElementById("khanOption")
            .classList.add("selected");
    }


    /* SAVE SETTINGS */
    function saveSettings() {

        const title =
            document.getElementById("titleInput").value;

        localStorage.setItem(
            "tabTitle",
            title || "Game Portal"
        );

        localStorage.setItem(
            "tabIcon",
            "khan-academy.jpg"
        );

        alert("Settings saved!");

    }


    /* BACK TO HOME */
    function goBack() {

        window.location.href = "index.html";

    }

</script>

</body>
</html>
