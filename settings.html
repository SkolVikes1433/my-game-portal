
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tab Settings</title>
<link id="favicon" rel="icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #05070b;
    color: #eaf3ff;
    font-family: 'Rajdhani', sans-serif;
}

header {
    padding: 20px;
    background: #080d15;
    border-bottom: 2px solid #168cff;
    text-align: center;
}

.logo {
    margin: 0;
    color: #168cff;
    font-family: 'Black Ops One', cursive;
    font-size: 25px;
}

main {
    max-width: 850px;
    margin: auto;
    padding: 24px 18px;
}

h2 {
    color: #168cff;
    font-family: 'Black Ops One', cursive;
}

.description { color: #a1b0c3; }

.app-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-top: 20px;
}

.app-button {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-height: 125px;
    padding: 15px 8px;
    background: #0b111b;
    color: #eaf3ff;
    border: 1px solid #263b53;
    border-radius: 7px;
    font-family: 'Black Ops One', cursive;
    font-size: 12px;
    cursor: pointer;
}

.app-button:hover {
    background: #101d2e;
    border-color: #168cff;
}

.app-button.selected {
    background: #10243a;
    border: 2px solid #168cff;
    box-shadow: 0 0 12px #168cff33;
}

.app-button img {
    width: 42px;
    height: 42px;
    object-fit: contain;
    border-radius: 6px;
}

.bottom-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 24px;
}

.action-button {
    display: inline-block;
    padding: 12px 18px;
    background: #0b1420;
    color: white;
    border: 1px solid #168cff;
    border-radius: 4px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 16px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
}

.action-button:hover {
    background: #168cff;
    color: black;
}

#status {
    min-height: 24px;
    margin-top: 16px;
    color: #72c2ff;
}

footer {
    padding: 20px;
    color: #66778c;
    text-align: center;
    border-top: 1px solid #172536;
}

@media (max-width: 450px) {
    .app-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>
</head>

<body>
<header>
    <h1 class="logo">VOID NETWORK V6</h1>
</header>

<main>
    <h2>⚙ SETTINGS</h2>
    <h3>Tab Icon</h3>
    <p class="description">Click an app to apply its browser-tab appearance.</p>

    <div class="app-grid" id="appGrid"></div>

    <div class="bottom-buttons">
        <button class="action-button" id="resetButton">DEFAULT</button>
        <a class="action-button" href="index.html">← BACK</a>
    </div>

    <p id="status" role="status" aria-live="polite"></p>
</main>

<footer>VOID NETWORK V6</footer>

<script>
const presets = [
    {
        id: "Default",
        label: "Default",
        title: "Void Network V6",
        icon: "favicon.ico",
        image: "https://www.google.com/s2/favicons?domain=github.com&sz=64"
    },
    {
        id: "Khan",
        label: "Khan Academy",
        title: "Khan Academy",
        icon: "https://cdn.kastatic.org/images/favicon.ico",
        image: "https://cdn.kastatic.org/images/favicon.ico"
    },
    {
        id: "Google",
        label: "Google",
        title: "Google",
        icon: "https://cdn.jsdelivr.net/gh/gamebackup/gamebackup.github.io@main/images/googleiconv2.png",
        image: "https://www.google.com/s2/favicons?domain=google.com&sz=64"
    },
    {
        id: "YouTube",
        label: "YouTube",
        title: "YouTube",
        icon: "https://www.youtube.com/s/desktop/2f549df7/img/favicon_32x32.png",
        image: "https://www.google.com/s2/favicons?domain=youtube.com&sz=64"
    },
    {
        id: "Canvas",
        label: "Canvas",
        title: "Dashboard",
        icon: "https://du11hjcvx0uqb.cloudfront.net/br/dist/images/favicon-e10d657a73.ico",
        image: "https://www.google.com/s2/favicons?domain=instructure.com&sz=64"
    },
    {
        id: "Docs",
        label: "Google Docs",
        title: "Google Docs",
        icon: "https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico",
        image: "https://www.google.com/s2/favicons?domain=docs.google.com&sz=64"
    },
    {
        id: "Desmos",
        label: "Desmos",
        title: "Desmos | Graphing Calculator",
        icon: "https://www.desmos.com/favicon.ico",
        image: "https://www.google.com/s2/favicons?domain=desmos.com&sz=64"
    },
    {
        id: "Drive",
        label: "Google Drive",
        title: "My Drive - Google Drive",
        icon: "https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png",
        image: "https://www.google.com/s2/favicons?domain=drive.google.com&sz=64"
    },
    {
        id: "Google Classroom",
        label: "Google Classroom",
        title: "Home - Classroom",
        icon: "https://edu.google.com/images/svg/gsuite-icons/classroom.svg",
        image: "https://www.google.com/s2/favicons?domain=classroom.google.com&sz=64"
    },
    {
        id: "XtraMath",
        label: "XtraMath",
        title: "XtraMath",
        icon: "https://cdn.prod.website-files.com/62db0786ca1a5127000f16e6/68f393b6311816a40a8da3c6_XM-FAVICON.png",
        image: "https://www.google.com/s2/favicons?domain=xtramath.org&sz=64"
    }
];

const appGrid = document.getElementById("appGrid");
const statusText = document.getElementById("status");

function getSavedPreset() {
    try {
        return localStorage.getItem("userCloak") || "Default";
    } catch (error) {
        return "Default";
    }
}

function applyFavicon(icon) {
    let favicon = document.getElementById("favicon");

    if (!favicon) {
        favicon = document.createElement("link");
        favicon.id = "favicon";
        favicon.rel = "icon";
        document.head.appendChild(favicon);
    }

    favicon.href = icon;
}

function updateButtonSelection() {
    const selected = getSavedPreset();

    document.querySelectorAll(".app-button").forEach(button => {
        const active = button.dataset.preset === selected;
        button.classList.toggle("selected", active);
        button.setAttribute("aria-pressed", String(active));
    });
}

function choosePreset(preset) {
    try {
        localStorage.setItem("userCloak", preset.id);
        localStorage.setItem("customTabTitle", "");
        localStorage.setItem("selectedTabIcon", preset.icon);

        document.title = preset.title;
        applyFavicon(preset.icon);
        updateButtonSelection();

        statusText.textContent = preset.label + " selected!";
    } catch (error) {
        statusText.textContent =
            "Settings could not be saved. Check your browser settings.";
    }
}

function renderButtons() {
    presets.forEach(preset => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "app-button";
        button.dataset.preset = preset.id;
        button.setAttribute("aria-pressed", "false");

        const img = document.createElement("img");
        img.src = preset.image;
        img.alt = "";
        img.onerror = () => {
            img.style.visibility = "hidden";
        };

        const label = document.createElement("span");
        label.textContent = preset.label;

        button.appendChild(img);
        button.appendChild(label);
        button.addEventListener("click", () => choosePreset(preset));

        appGrid.appendChild(button);
    });

    updateButtonSelection();
}

document.getElementById("resetButton").addEventListener("click", () => {
    choosePreset(presets[0]);
});

renderButtons();

/* Show the saved appearance on the settings tab too */
const current = presets.find(item => item.id === getSavedPreset()) || presets[0];
let savedCustomTitle = "";

try {
    savedCustomTitle = localStorage.getItem("customTabTitle") || "";
} catch (error) {}

document.title = savedCustomTitle.trim() || current.title;

try {
    applyFavicon(localStorage.getItem("selectedTabIcon") || current.icon);
} catch (error) {
    applyFavicon(current.icon);
}
</script>
</body>
</html>
