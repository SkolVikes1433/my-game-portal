
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab Settings</title>

    <link id="favicon" rel="icon" href="favicon.ico">

    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #05070b;
            color: #eaf3ff;
            font-family: 'Rajdhani', sans-serif;
        }

        header {
            padding: 20px;
            background: #080c13;
            border-bottom: 2px solid #168cff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 28px;
            color: #168cff;
            font-weight: 700;
            letter-spacing: 2px;
        }

        button, input {
            font-family: inherit;
            font-size: 17px;
        }

        button {
            background: #101927;
            border: 1px solid #168cff;
            border-radius: 5px;
            color: white;
            padding: 10px 16px;
            cursor: pointer;
            font-weight: 700;
        }

        button:hover {
            background: #168cff;
            color: #05070b;
        }

        main {
            max-width: 850px;
            margin: 30px auto;
            padding: 0 20px;
        }

        h1 {
            color: #168cff;
            font-size: 32px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #94a8bf;
            margin-bottom: 25px;
            font-size: 17px;
        }

        .panel {
            background: #0b111b;
            border: 1px solid #1c3550;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        h2 {
            color: #168cff;
            margin-top: 0;
            font-size: 23px;
        }

        .preset-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
            gap: 10px;
        }

        .preset {
            min-height: 55px;
        }

        input {
            width: 100%;
            background: #05070b;
            color: white;
            border: 1px solid #29415b;
            border-radius: 5px;
            padding: 12px;
            margin: 8px 0 12px;
            outline: none;
        }

        input:focus {
            border-color: #168cff;
        }

        .wide {
            width: 100%;
        }

        .status {
            color: #69b7ff;
            margin-top: 12px;
            min-height: 24px;
        }

        .note {
            color: #8da2b9;
            font-size: 15px;
            line-height: 1.5;
        }

        @media (max-width: 500px) {
            header {
                padding: 15px;
            }

            .logo {
                font-size: 23px;
            }

            main {
                margin-top: 20px;
                padding: 0 12px;
            }

            .panel {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">VOID NETWORK V6</div>
    <button onclick="location.href='index.html'">← Back to Games</button>
</header>

<main>
    <h1>Tab Cloaking</h1>
    <p class="subtitle">Customize the title and icon shown in your browser tab.</p>

    <section class="panel">
        <h2>Choose a Tab Preset</h2>
        <p class="note">Select a preset to change your tab title and icon.</p>

        <div class="preset-grid">
            <button class="preset" onclick="selectCloak('Default')">Void Network</button>
            <button class="preset" onclick="selectCloak('Google')">Google</button>
            <button class="preset" onclick="selectCloak('YouTube')">YouTube</button>
            <button class="preset" onclick="selectCloak('Canvas')">Canvas</button>
            <button class="preset" onclick="selectCloak('Khan')">Khan Academy</button>
            <button class="preset" onclick="selectCloak('Docs')">Google Docs</button>
            <button class="preset" onclick="selectCloak('Desmos')">Desmos</button>
            <button class="preset" onclick="selectCloak('Drive')">Google Drive</button>
            <button class="preset" onclick="selectCloak('Google Classroom')">Classroom</button>
            <button class="preset" onclick="selectCloak('XtraMath')">XtraMath</button>
        </div>

        <p id="presetStatus" class="status" aria-live="polite">No preset selected yet.</p>
    </section>

    <section class="panel">
        <h2>Custom Tab Title</h2>
        <label for="customTitle">Enter a title for your browser tab</label>
        <input id="customTitle" type="text" maxlength="80"
               placeholder="Enter a custom title">

        <button class="wide" onclick="saveCustomTitle()">Save Custom Title</button>
    </section>

    <section class="panel">
        <h2>Reset Settings</h2>
        <p class="note">Restore the default Void Network tab title and icon.</p>
        <button class="wide" onclick="resetCloak()">Reset Tab Settings</button>
    </section>
</main>

<script>
    const cloakPresets = {
        "Default": {
            title: "Void Network V6",
            icon: "favicon.ico"
        },
        "Google": {
            title: "Google",
            icon: "https://cdn.jsdelivr.net/gh/gamebackup/gamebackup.github.io@main/images/googleiconv2.png"
        },
        "YouTube": {
            title: "YouTube",
            icon: "https://www.youtube.com/s/desktop/2f549df7/img/favicon_32x32.png"
        },
        "Canvas": {
            title: "Dashboard",
            icon: "https://du11hjcvx0uqb.cloudfront.net/br/dist/images/favicon-e10d657a73.ico"
        },
        "Khan": {
            title: "Khan Academy",
            icon: "https://cdn.kastatic.org/images/favicon.ico"
        },
        "Docs": {
            title: "Google Docs",
            icon: "https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico"
        },
        "Desmos": {
            title: "Desmos | Graphing Calculator",
            icon: "https://www.desmos.com/favicon.ico"
        },
        "Drive": {
            title: "My Drive - Google Drive",
            icon: "https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png"
        },
        "Google Classroom": {
            title: "Home - Classroom",
            icon: "https://edu.google.com/images/svg/gsuite-icons/classroom.svg"
        },
        "XtraMath": {
            title: "XtraMath",
            icon: "https://cdn.prod.website-files.com/62db0786ca1a5127000f16e6/68f393b6311816a40a8da3c6_XM-FAVICON.png"
        }
    };

    function applyPreset(key) {
        const preset = cloakPresets[key];
        if (!preset) return;

        localStorage.setItem("userCloak", key);
        localStorage.removeItem("customTabTitle");
        localStorage.setItem("selectedTabIcon", preset.icon);

        document.title = preset.title;
        document.getElementById("favicon").href = preset.icon;
        document.getElementById("customTitle").value = "";

        document.getElementById("presetStatus").textContent =
            "Selected: " + preset.title + ". Your choice has been saved.";
    }

    function selectCloak(key) {
        applyPreset(key);
    }

    function saveCustomTitle() {
        const title = document.getElementById("customTitle").value.trim();

        if (!title) {
            document.getElementById("presetStatus").textContent =
                "Please enter a title first.";
            return;
        }

        localStorage.setItem("customTabTitle", title);
        localStorage.setItem("userCloak", "Custom");

        document.title = title;

        document.getElementById("presetStatus").textContent =
            "Custom title saved: " + title;
    }

    function resetCloak() {
        localStorage.removeItem("userCloak");
        localStorage.removeItem("customTabTitle");
        localStorage.removeItem("selectedTabIcon");

        document.title = cloakPresets.Default.title;
        document.getElementById("favicon").href = cloakPresets.Default.icon;
        document.getElementById("customTitle").value = "";

        document.getElementById("presetStatus").textContent =
            "Tab settings reset.";
    }

    // Restore the selected preset when settings opens
    const savedKey = localStorage.getItem("userCloak") || "Default";
    const customTitle = localStorage.getItem("customTabTitle");

    if (customTitle) {
        document.title = customTitle;
        document.getElementById("customTitle").value = customTitle;
        document.getElementById("presetStatus").textContent =
            "Your custom tab title is active.";
    } else if (cloakPresets[savedKey]) {
        document.title = cloakPresets[savedKey].title;
        document.getElementById("favicon").href = cloakPresets[savedKey].icon;
        document.getElementById("presetStatus").textContent =
            "Current preset: " + cloakPresets[savedKey].title;
    }
</script>

</body>
</html>
