<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settings - Game Portal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #05070a;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            height: 70px;
            background: #080b10;
            border-bottom: 2px solid #168cff;
            display: flex;
            align-items: center;
            padding: 0 25px;
        }

        .logo {
            color: #168cff;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .settings {
            max-width: 600px;
            margin: 50px auto;
            padding: 25px;
            background: #0b0f15;
            border: 1px solid #168cff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(22, 140, 255, 0.2);
        }

        h1 {
            color: #168cff;
        }

        .label {
            margin-top: 25px;
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        /* KHAN ACADEMY BUTTON */
        .khan-button {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px;
            background: #05070a;
            color: white;
            border: 2px solid #168cff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
        }

        .khan-button:hover {
            background: #101923;
        }

        .khan-button.selected {
            box-shadow: 0 0 15px #168cff;
        }

        .khan-button img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            border-radius: 6px;
        }

        button {
            margin-top: 25px;
            padding: 11px 20px;
            border-radius: 6px;
            border: none;
            background: #168cff;
            color: black;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #54b0ff;
        }

        .back {
            background: transparent;
            color: #168cff;
            border: 1px solid #168cff;
            margin-right: 8px;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">GAME PORTAL</div>
</header>

<div class="settings">

    <h1>⚙ SETTINGS</h1>

    <div class="label">
        Tab Icon
    </div>

    <!-- KHAN ACADEMY BUTTON -->
    <button
        class="khan-button"
        id="khanButton"
        onclick="selectKhan()"
    >
        <img src="khan-academy.jpg" alt="Khan Academy">

        <span>Khan Academy</span>
    </button>

    <br>

    <button class="back" onclick="goBack()">
        ← BACK
    </button>

    <button onclick="saveSettings()">
        SAVE SETTINGS
    </button>

</div>

<script>

    /* SELECT KHAN ACADEMY */
    function selectKhan() {

        localStorage.setItem(
            "tabIcon",
            "khan-academy.jpg"
        );

        document
            .getElementById("khanButton")
            .classList.add("selected");
    }


    /* SAVE SETTINGS */
    function saveSettings() {

        localStorage.setItem(
            "tabIcon",
            "khan-academy.jpg"
        );

        alert("Khan Academy selected!");

    }


    /* BACK */
    function goBack() {

        window.location.href = "index.html";

    }

</script>

</body>
</html>
