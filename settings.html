
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tab Settings</title>
<link id="favicon" rel="icon" href="void-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#05070d;color:#eaf4ff;font-family:Rajdhani,sans-serif}
header{text-align:center;padding:24px;background:#03060d;border-bottom:1px solid #19385e}
h1{margin:0;color:#48a9ff;font:30px 'Black Ops One',cursive}
main{width:min(900px,94%);margin:30px auto}
.panel{padding:22px;background:#0a111e;border:1px solid #1b3555;border-radius:12px}
h2{color:#55b2ff;margin-top:0}
p{color:#9cb2ce}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
button{padding:16px 10px;border:1px solid #263e5d;border-radius:8px;background:#101b2c;color:#eaf4ff;font:700 18px Rajdhani,sans-serif;cursor:pointer}
button:hover{border-color:#48a9ff;background:#142945}
button.selected{border:2px solid #42a5ff;background:#102b49}
.back{display:inline-block;margin-top:20px;color:#72bdff;text-decoration:none;font-size:18px}
#status{min-height:24px;color:#71e6a2}
@media(max-width:450px){h1{font-size:24px}.panel{padding:15px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header><h1>VOID NETWORK V6</h1><p>Tab Cloaker Settings</p></header>
<main>
<section class="panel">
<h2>Choose a Tab Icon</h2>
<p>Select a button to change your browser tab title and icon.</p>
<div class="grid" id="presetGrid"></div>
<p id="status" role="status" aria-live="polite"></p>
</section>
<a class="back" href="index.html">← Back to Hub</a>
</main>
<script>
const presets=[
 {id:"Default",name:"Default",title:"VOID NETWORK V6",icon:"void-logo.png"},
 {id:"Khan",name:"Khan Academy",title:"Khan Academy",icon:"https://cdn.kastatic.org/images/favicon.ico"},
 {id:"Google",name:"Google",title:"Google",icon:"https://www.google.com/favicon.ico"},
 {id:"YouTube",name:"YouTube",title:"YouTube",icon:"https://www.youtube.com/s/desktop/2f549df7/img/favicon_32x32.png"},
 {id:"Docs",name:"Google Docs",title:"Google Docs",icon:"https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico"},
 {id:"Desmos",name:"Desmos",title:"Desmos",icon:"https://www.desmos.com/favicon.ico"},
 {id:"Drive",name:"Google Drive",title:"My Drive - Google Drive",icon:"https://drive.google.com/favicon.ico"},
 {id:"Google Classroom",name:"Google Classroom",title:"Home - Classroom",icon:"https://classroom.google.com/favicon.ico"},
 {id:"XtraMath",name:"XtraMath",title:"XtraMath",icon:"https://xtramath.org/favicon.ico"}
];

const grid=document.getElementById("presetGrid");
const status=document.getElementById("status");

function read(key,fallback=""){
 try{return localStorage.getItem(key)||fallback}catch(e){return fallback}
}
function write(key,value){
 try{localStorage.setItem(key,value);return true}catch(e){status.textContent="Browser storage is blocked. Settings could not be saved.";return false}
}
function selectPreset(p){
 if(!write("userCloak",p.id))return;
 write("customTabTitle",p.title);
 write("selectedTabIcon",p.icon);
 document.title=p.title;
 const favicon=document.getElementById("favicon");
 favicon.href=p.icon;
 document.querySelectorAll("button[data-id]").forEach(b=>{
  const active=b.dataset.id===p.id;
  b.classList.toggle("selected",active);
  b.setAttribute("aria-pressed",String(active));
 });
 status.textContent=p.name+" selected and saved.";
}

presets.forEach(p=>{
 const b=document.createElement("button");
 b.type="button";
 b.textContent=p.name;
 b.dataset.id=p.id;
 b.addEventListener("click",()=>selectPreset(p));
 grid.appendChild(b);
});

const saved=read("userCloak","Default");
const initial=presets.find(p=>p.id===saved)||presets[0];
document.querySelectorAll("button[data-id]").forEach(b=>{
 const active=b.dataset.id===initial.id;
 b.classList.toggle("selected",active);
 b.setAttribute("aria-pressed",String(active));
});
</script>
</body>
</html>
