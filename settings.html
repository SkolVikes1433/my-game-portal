
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tab Settings</title>
<link id="favicon" rel="icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #05070b;
  color: #eaf3ff;
  font-family: 'Rajdhani', sans-serif;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  padding: 18px 22px;
  background: #080d15;
  border-bottom: 2px solid #168cff;
}

h1 {
  margin: 0;
  color: #168cff;
  font-family: 'Black Ops One', cursive;
  font-size: 25px;
}

nav {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

nav a {
  padding: 10px 14px;
  background: #0b1420;
  color: white;
  border: 1px solid #168cff;
  border-radius: 4px;
  text-decoration: none;
  font-weight: 700;
}

nav a:hover {
  background: #168cff;
  color: black;
}

main {
  width: min(850px, 94%);
  margin: 35px auto;
}

.panel {
  padding: 24px;
  background: #0b111b;
  border: 1px solid #1c2c40;
  border-radius: 8px;
}

h2 {
  margin-top: 0;
  color: #168cff;
  font-family: 'Black Ops One', cursive;
}

p {
  color: #a1b0c3;
  font-size: 17px;
}

.preset-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
  margin-top: 22px;
}

.preset-button {
  min-height: 52px;
  padding: 12px;
  background: #0b1420;
  color: #eaf3ff;
  border: 1px solid #294362;
  border-radius: 5px;
  font: 700 16px 'Rajdhani', sans-serif;
  cursor: pointer;
}

.preset-button:hover {
  background: #101d2e;
  border-color: #168cff;
}

.preset-button.selected {
  background: #102b49;
  border: 2px solid #168cff;
}

#status {
  min-height: 25px;
  margin-top: 20px;
  color: #76e6a2;
}

footer {
  padding: 24px;
  text-align: center;
  color: #66778c;
}

@media (max-width: 500px) {
  header { padding: 15px; }
  h1 { font-size: 21px; }
  .panel { padding: 16px; }

  .preset-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
</style>
</head>

<body>

<header>
  <h1>VOID NETWORK V6</h1>
  <nav>
    <a href="index.html">Games</a>
    <a href="settings.html">Tab Settings</a>
  </nav>
</header>

<main>
  <section class="panel">
    <h2>TAB CLOAKER</h2>
    <p>Choose a preset to change the browser tab title and favicon.</p>

    <div class="preset-grid" id="presetGrid"></div>
    <p id="status" role="status" aria-live="polite"></p>
  </section>
</main>

<footer>VOID NETWORK V6</footer>

<script>
const presets = [
  {
    id: "Default",
    name: "Default",
    title: "Void Network V6",
    icon: "favicon.ico"
  },
  {
    id: "Khan",
    name: "Khan Academy",
    title: "Khan Academy",
    icon: "https://cdn.kastatic.org/images/favicon.ico"
  },
  {
    id: "Google",
    name: "Google",
    title: "Google",
    icon: "https://cdn.jsdelivr.net/gh/gamebackup/gamebackup.github.io@main/images/googleiconv2.png"
  },
  {
    id: "YouTube",
    name: "YouTube",
    title: "YouTube",
    icon: "https://www.youtube.com/s/desktop/2f549df7/img/favicon_32x32.png"
  },
  {
    id: "Canvas",
    name: "Canvas",
    title: "Dashboard",
    icon: "https://du11hjcvx0uqb.cloudfront.net/br/dist/images/favicon-e10d657a73.ico"
  },
  {
    id: "Docs",
    name: "Google Docs",
    title: "Google Docs",
    icon: "https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico"
  },
  {
    id: "Desmos",
    name: "Desmos",
    title: "Desmos | Graphing Calculator",
    icon: "https://www.desmos.com/favicon.ico"
  },
  {
    id: "Drive",
    name: "Google Drive",
    title: "My Drive - Google Drive",
    icon: "https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png"
  },
  {
    id: "Google Classroom",
    name: "Google Classroom",
    title: "Home - Classroom",
    icon: "https://edu.google.com/images/svg/gsuite-icons/classroom.svg"
  },
  {
    id: "XtraMath",
    name: "XtraMath",
    title: "XtraMath",
    icon: "https://cdn.prod.website-files.com/62db0786ca1a5127000f16e6/68f393b6311816a40a8da3c6_XM-FAVICON.png"
  }
];

const grid = document.getElementById("presetGrid");
const status = document.getElementById("status");

function readStorage(key, fallback = "") {
  try {
    return localStorage.getItem(key) || fallback;
  } catch {
    return fallback;
  }
}

function setFavicon(url) {
  document.getElementById("favicon").href = url || "favicon.ico";
}

function updateSelectedButton() {
  const current = readStorage("userCloak", "Default");

  document.querySelectorAll(".preset-button").forEach(button => {
    const selected = button.dataset.id === current;
    button.classList.toggle("selected", selected);
    button.setAttribute("aria-pressed", String(selected));
  });
}

function selectPreset(preset) {
  try {
    localStorage.setItem("userCloak", preset.id);
    localStorage.setItem("customTabTitle", preset.title);
    localStorage.setItem("selectedTabIcon", preset.icon);
  } catch {
    status.textContent = "Could not save settings in this browser.";
    return;
  }

  document.title = preset.title;
  setFavicon(preset.icon);
  updateSelectedButton();
  status.textContent = preset.name + " selected! Your Games page will use this preset.";
}

presets.forEach(preset => {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "preset-button";
  button.dataset.id = preset.id;
  button.textContent = preset.name;
  button.addEventListener("click", () => selectPreset(preset));
  grid.appendChild(button);
});

const savedTitle = readStorage("customTabTitle");
const savedIcon = readStorage("selectedTabIcon");

if (savedTitle) document.title = savedTitle;
if (savedIcon) setFavicon(savedIcon);

updateSelectedButton();
</script>

</body>
</html>
