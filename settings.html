```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tab Settings</title>

<link id="favicon" rel="icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #05070b;
    color: #eaf3ff;
    font-family: 'Rajdhani', sans-serif;
}

header {
    padding: 22px 15px;
    text-align: center;
    background: #080d15;
    border-bottom: 2px solid #168cff;
}

.logo {
    margin: 0;
    color: #168cff;
    font-family: 'Black Ops One', cursive;
    font-size: 26px;
}

main {
    max-width: 900px;
    margin: auto;
    padding: 25px 18px;
}

h2, h3 {
    font-family: 'Black Ops One', cursive;
}

h2 {
    color: #168cff;
}

.description {
    color: #a1b0c3;
    line-height: 1.6;
}

.app-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
    gap: 12px;
    margin-top: 22px;
}

.app-button {
    min-height: 125px;
    padding: 14px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: #0b111b;
    color: #eaf3ff;
    border: 1px solid #263b53;
    border-radius: 7px;
    font-family: 'Black Ops One', cursive;
    font-size: 11px;
    cursor: pointer;
    overflow-wrap: anywhere;
}

.app-button:hover {
    background: #102039;
    border-color: #168cff;
}

.app-button.selected {
    background: #10243a;
    border: 2px solid #168cff;
    box-shadow: 0 0 12px #168cff44;
}

.icon-box {
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
}

.app-button img {
    width: 42px;
    height: 42px;
    object-fit: contain;
}

.letter-icon {
    font-family: Arial, sans-serif;
    font-size: 32px;
    font-weight: bold;
    color: #168cff;
}

.bottom-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 25px;
}

.action-button {
    padding: 12px 20px;
    background: #0b1420;
    color: white;
    border: 1px solid #168cff;
    border-radius: 4px;
    text-decoration: none;
    font-family: 'Rajdhani', sans-serif;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.action-button:hover {
    background: #168cff;
    color: black;
}

#status {
    min-height: 24px;
    margin-top: 18px;
    color: #72c2ff;
}

footer {
    margin-top: 30px;
    padding: 22px;
    text-align: center;
    color: #66778c;
    border-top: 1px solid #172536;
}

@media (max-width: 400px) {
    .app-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}
</style>
</head>

<body>

<header>
    <h1 class="logo">VOID NETWORK V6</h1>
</header>

<main>
    <h2>⚙ SETTINGS</h2>
    <h3>Tab Icon</h3>

    <p class="description">
        Choose an app to change your browser tab title and icon.
        Your selection saves automatically.
    </p>

    <div class="app-grid" id="appGrid"></div>

    <div class="bottom-buttons">
        <button class="action-button" id="resetButton" type="button">
            DEFAULT
        </button>

        <a class="action-button" href="index.html">
            ← BACK
        </a>
    </div>

    <p id="status" role="status" aria-live="polite"></p>
</main>

<footer>VOID NETWORK V6</footer>

<script>
const presets = [
    {
        id: "Default",
        label: "Default",
        title: "Void Network V6",
        icon: "favicon.ico",
        image: "https://github.githubassets.com/favicons/favicon.png"
    },
    {
        id: "Khan",
        label: "Khan Academy",
        title: "Khan Academy",
        icon: "https://cdn.kastatic.org/images/favicon.ico",
        image: "https://cdn.kastatic.org/images/favicon.ico"
    },
    {
        id: "Google",
        label: "Google",
        title: "Google",
        icon: "https://www.google.com/favicon.ico",
        image: "https://www.google.com/favicon.ico"
    },
    {
        id: "YouTube",
        label: "YouTube",
        title: "YouTube",
        icon: "https://www.youtube.com/s/desktop/2f549df7/img/favicon_32x32.png",
        image: "https://www.youtube.com/s/desktop/2f549df7/img/favicon_32x32.png"
    },
    {
        id: "Canvas",
        label: "Canvas",
        title: "Dashboard",
        icon: "https://du11hjcvx0uqb.cloudfront.net/br/dist/images/favicon-e10d657a73.ico",
        image: "https://du11hjcvx0uqb.cloudfront.net/br/dist/images/favicon-e10d657a73.ico"
    },
    {
        id: "Docs",
        label: "Google Docs",
        title: "Google Docs",
        icon: "https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico",
        image: "https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico"
    },
    {
        id: "Desmos",
        label: "Desmos",
        title: "Desmos | Graphing Calculator",
        icon: "https://www.desmos.com/favicon.ico",
        image: "https://www.desmos.com/favicon.ico"
    },
    {
        id: "Drive",
        label: "Google Drive",
        title: "My Drive - Google Drive",
        icon: "https://drive.google.com/favicon.ico",
        image: "https://drive.google.com/favicon.ico"
    },
    {
        id: "Google Classroom",
        label: "Google Classroom",
        title: "Home - Classroom",
        icon: "https://ssl.gstatic.com/classroom/favicon.png",
        image: "https://ssl.gstatic.com/classroom/favicon.png"
    },
    {
        id: "XtraMath",
        label: "XtraMath",
        title: "XtraMath",
        icon: "https://xtramath.org/favicon.ico",
        image: "https://xtramath.org/favicon.ico"
    }
];

const grid = document.getElementById("appGrid");
const status = document.getElementById("status");

function readSetting(key, fallback) {
    try {
        return localStorage.getItem(key) || fallback;
    } catch (error) {
        return fallback;
    }
}

function setFavicon(url) {
    let link = document.getElementById("favicon");

    if (!link) {
        link = document.createElement("link");
        link.id = "favicon";
        link.rel = "icon";
        document.head.appendChild(link);
    }

    link.href = url;
}

function updateSelection() {
    const selected = readSetting("userCloak", "Default");

    document.querySelectorAll(".app-button").forEach(button => {
        const active = button.dataset.preset === selected;
        button.classList.toggle("selected", active);
        button.setAttribute("aria-pressed", String(active));
    });
}

function selectPreset(preset) {
    try {
        localStorage.setItem("userCloak", preset.id);
        localStorage.setItem("customTabTitle", "");
        localStorage.setItem("selectedTabIcon", preset.icon);

        document.title = preset.title;
        setFavicon(preset.icon);
        updateSelection();

        status.textContent = preset.label + " selected!";
    } catch (error) {
        status.textContent = "Could not save your settings.";
    }
}

function makeButton(preset) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "app-button";
    button.dataset.preset = preset.id;
    button.setAttribute("aria-pressed", "false");

    const box = document.createElement("span");
    box.className = "icon-box";

    const img = document.createElement("img");
    img.src = preset.image;
    img.alt = "";
    img.loading = "eager";

    img.onerror = function () {
        box.replaceChildren();

        const letter = document.createElement("span");
        letter.className = "letter-icon";
        letter.textContent = preset.label.charAt(0);

        box.appendChild(letter);
    };

    box.appendChild(img);

    const label = document.createElement("span");
    label.textContent = preset.label;

    button.appendChild(box);
    button.appendChild(label);

    button.addEventListener("click", () => selectPreset(preset));

    grid.appendChild(button);
}

presets.forEach(makeButton);

document.getElementById("resetButton").addEventListener("click", () => {
    selectPreset(presets[0]);
});

const savedId = readSetting("userCloak", "Default");
const savedPreset = presets.find(p => p.id === savedId) || presets[0];

document.title =
    readSetting("customTabTitle", "").trim() || savedPreset.title;

setFavicon(readSetting("selectedTabIcon", savedPreset.icon));

updateSelection();
</script>

</body>
</html>
